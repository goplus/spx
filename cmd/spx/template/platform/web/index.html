<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	<title>XGo Builder</title>
	<link rel="stylesheet" href="lab/index.css">
	<script src="fflate.js"></script>
</head>
<body>
	<div class="toolbar" role="toolbar" aria-label="Test controls">
		<div class="toolbar-group toolbar-run-controls" role="group" aria-label="Game controls">
			<span class="toolbar-group-label">Game</span>
			<div class="toolbar-group-body">
				<button id="startGameBtn" class="toolbar-primary-action">Start</button>
				<button id="stopGameBtn">Stop</button>
			</div>
		</div>
		<div class="toolbar-group toolbar-session-controls" role="group" aria-label="Input and capture controls">
			<span class="toolbar-group-label">Input &amp; Capture</span>
			<div class="toolbar-group-body">
				<button id="inputModeBtn" class="toolbar-mode-action" title="Switch input mode">Normal</button>
				<button id="selectCaptureDirBtn">Choose Folder</button>
				<button id="refreshCompareBtn">Refresh</button>
				<span id="inputModeStatus" class="toolbar-status" hidden></span>
				<span id="captureStatus" class="toolbar-status">Output · Downloads</span>
			</div>
		</div>
		<div class="toolbar-group toolbar-debug-controls" role="group" aria-label="Debug controls">
			<span class="toolbar-group-label">Debug</span>
			<div class="toolbar-group-body">
				<button id="pauseGameBtn">Pause</button>
				<button id="resumeGameBtn">Resume</button>
				<button id="stepNextFrameBtn">Step</button>
				<button id="toggleSizeBtn">Resize</button>
			</div>
		</div>
	</div>

	<progress id="progress-bar" value="0" max="1" hidden></progress>
	<div id="tabs">
		<div id="tab-loader"></div>
		<div id="tab-game" hidden></div>
	</div>
	<section class="control-group">
		<h2>Test Animation</h2>
		<div class="animation-container"><div class="animation-box"></div></div>
	</section>

	<iframe id="runnerFrame" src="runner.html" width="480" height="360"></iframe>
	<section class="capture-compare-panel">
		<div class="capture-compare-header">
			<h2 class="capture-compare-title">Snapshot Comparison</h2>
			<span id="captureCompareSummary" class="capture-compare-summary">Choose a capture folder and input mode, then start.</span>
		</div>
		<div id="captureCompareGrid" class="capture-compare-grid">
			<div class="capture-compare-empty">Choose a capture folder and input mode, then start.</div>
		</div>
	</section>

	<script src="lab/index.js"></script>
</body>
</html>
