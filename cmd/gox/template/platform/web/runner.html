<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	<title>XGo Builder</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background: transparent;
			background-color: transparent;
			overflow: hidden;
		}

		canvas {
			display: block;
			margin: 0;
			outline: none;
		}
	</style>
</head>

<body>
	<div id="tabs">
		<div id="tab-loader">
		</div>
		<div id="tab-editor" style="display: none;">
			<canvas id="editor-canvas" tabindex="1"></canvas>
		</div>
		<div id="tab-game" style="display: none;">
			<canvas id="game-canvas" tabindex="2"></canvas>
		</div>
	</div>
	<script>var miniEngine = null</script>
	<script>var isWasmCompressed = false</script>
	<script src="go.wasm.exec.js"></script>
	<script src="storage.manager.js"></script>
	<script src="worker.message.manager.js"></script>
	<script src="engine.js"></script>
	<script src="game.js"></script>
	<script>
		"use strict";
		let gameApp = null
		let preInitialized = false;
		let preInitPromise = null;
		let isShowEditor = false
		let onGameError = null
		let _onSpxReady = null
		let lastGameApp = null

		window.spxIsProxyThreadMode = false
		let onGameExit = null
		
		window.preInitGame = async function(assetURLs) {
			console.log('[PreInit] Starting pre-initialization...', preInitialized);
			const startTime = performance.now();
			
			if (preInitialized) {
				console.log('[PreInit] Already initialized');
				return;
			}
			
			if (preInitPromise) {
				console.log('[PreInit] Waiting for existing initialization...');
				return preInitPromise;
			}

			preInitPromise = _doPreInit(assetURLs);
			try {
				await preInitPromise;
				preInitialized = true;
			} catch (error) {
				console.log('[PreInit] Pre-initialization failed, will retry on demand:', error);
				preInitPromise = null;
				throw error;
			}
			
			const totalTime = performance.now() - startTime;
			console.log('[PreInit] ✅ Pre-initialization completed in', totalTime + 'ms');
		}
		
		async function _doPreInit(assetURLs) {
			console.log('[PreInit] Starting pre-initialization...');
			const config = {
				'projectName': "spx_game",
				'onProgress': onProgress,
				"gameCanvas": document.getElementById('game-canvas'),
				"logLevel": LOG_LEVEL_NONE,
				"useProfiler": false,
				"useAssetCache": false,
				"isRuntimeMode": true,
				"assetURLs": assetURLs || defaultAssetURLs,
				"recordingOnGameStart": false,
				"autoDownloadRecordedVideo":false,
			};

			console.log('[PreInit] Creating GameApp instance...');
			const gameAppStartTime = performance.now();
			gameApp = new GameApp(config);
			console.log('[PreInit] GameApp created in', performance.now() - gameAppStartTime + 'ms');
			
			// 如果 GameApp 有 preInit 方法，则调用它
			if (typeof gameApp.preInit === 'function') {
				console.log('[PreInit] Calling gameApp.preInit()...');
				const preInitStartTime = performance.now();
				await gameApp.preInit();
				console.log('[PreInit] gameApp.preInit() completed in', performance.now() - preInitStartTime + 'ms');
			} else {
				console.log('[PreInit] gameApp.preInit() not available, skipping...');
			}
		}

		function onProgress(value) {
			const progressEvent = new CustomEvent('onProgress', {
				detail: {
					progress: value
				}
			});
			window.dispatchEvent(progressEvent);
			if (value >= 1) {
				document.getElementById('tab-game').style.display = 'none';
				document.getElementById('tab-editor').style.display = 'none';
				document.getElementById('tab-loader').style.display = 'none';
				let canvas = null
				if (gameApp.isEditor) {
					if (isShowEditor) {
						document.getElementById('tab-editor').style.display = 'block';
					}
					canvas = document.getElementById('editor-canvas')
				} else {
					document.getElementById('tab-game').style.display = 'block';
					canvas = document.getElementById('game-canvas')
				}
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
			}
		}

		window.gdspx_on_runtime_panic = function (msg) {
			if (onGameError != null) {
				onGameError(msg)
			}
		}
		window.onGameError = function (callback) {
			onGameError = callback
		}

		window.gdspx_on_runtime_exit = function (code) {
			if (onGameExit != null) {
				onGameExit(code)
			}
		}

		window.onGameExit = function (callback) {
			onGameExit = callback
		}
		
		window.startGame = async (buffer, gameHash, assetURLs = null, onSpxReady = null, cfg = null) => {
			console.log('[StartGame] Starting game with pre-initialization...');
			const startTime = performance.now();
			
			// 确保预初始化完成
			await preInitGame(assetURLs);
			console.log('[StartGame] Starting game with preInitGame done...');
			
			isShowEditor = false
			lastGameApp = null
			_onSpxReady = onSpxReady
			if(EnginePackMode == "worker"){
				window.setAIDescription = function (description) {
					gameApp.callWorkerFunction("setAIDescription", description)
				}
				window.setAIInteractionAPIEndpoint = function (endpoint) {
					gameApp.callWorkerFunction("setAIInteractionAPIEndpoint", endpoint)
				}
				window.setAIInteractionAPITokenProvider = function (tokenProviderFunction) {
					gameApp.callWorkerFunction("setAIInteractionAPITokenProvider", tokenProviderFunction)
				}

				window.onWasmLoaded = function () {
					if (_onSpxReady != null) {
						_onSpxReady()
					}
				}
				window.onGameStarted = function () {
				}
			}

			console.log('[StartGame] Stopping previous game if any...');
			// 停止之前的游戏
			// if (gameApp != null) {
			// 	await gameApp.StopGame();
			// }

			// 更新 gameApp 配置而不重新创建
			console.log('[StartGame] Updating GameApp config...');
			const updateConfigTime = performance.now();
			
			gameApp.projectData = new Uint8Array(buffer);
			gameApp.curProjectHash = gameHash;
			gameApp.onSpxReady = onSpxReady;
			
			if (assetURLs != null) {
				Object.assign(gameApp.config.assetURLs, assetURLs);
			}
			if (cfg != null) {
				Object.assign(gameApp.config, cfg);
			}
			
			console.log('[StartGame] Config updated in', performance.now() - updateConfigTime + 'ms');
			
			const runGameTime = performance.now();
			console.log('[StartGame] Running game...');
			await gameApp.RunGame();
			console.log('[StartGame] ✅ Game started successfully in', performance.now() - startTime + 'ms');
			console.log('[StartGame] RunGame duration:', performance.now() - runGameTime + 'ms');
		}
		
		window.buildGame = async (buffer, gameHash, assetURLs = null) => {
			console.log('[BuildGame] Starting game build...');
			const startTime = performance.now();
			
			await preInitGame();

			if (gameApp != null) {
				await gameApp.StopProject();
			}

			console.log('[BuildGame] Updating GameApp config...');
			const updateConfigTime = performance.now();
			
			gameApp.projectData = new Uint8Array(buffer);
			gameApp.curProjectHash = gameHash;
			
			if (assetURLs != null) {
				Object.assign(gameApp.config.assetURLs, assetURLs);
			}
			if (cfg != null) {
				Object.assign(gameApp.config, cfg);
			}
			
			console.log('[BuildGame] Config updated in', performance.now() - updateConfigTime + 'ms');
			
			const buildGameTime = performance.now();
			console.log('[BuildGame] Building game...');
			await gameApp.BuildGame();
			console.log('[BuildGame] ✅ Game built successfully in', performance.now() - startTime + 'ms');
			console.log('[BuildGame] BuildGame duration:', performance.now() - buildGameTime + 'ms');
		}

		// Starts recording the game canvas content as video
		window.startRecording = () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			gameApp.startRecording()
		}
		// Stops the current recording session and returns the result as a Blob.
		window.stopRecording = async () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			return await gameApp.stopRecording()
		}

		// Returns the recorded video as a Blob.
		window.getRecordedVideo = () => {
			let app = gameApp || lastGameApp
			if (app == null) {
				console.error("gameApp is null, should call startGame first")
				return null
			}
			lastGameApp = null
			return app.getRecordedVideo()
		}

		// Captures the current game screen and returns its binary data as a Blob.
		window.getScreenshot = async () => {
			let gameCanvas = document.getElementById('game-canvas')
			if (!gameCanvas) {
				console.error("gameCanvas not found")
				return null
			}
			if (!gameCanvas.toBlob) {
				console.error("gameCanvas.toBlob not supported")
				return null
			}
			return new Promise((resolve) => {
				gameCanvas.toBlob((blob) => {
					resolve(blob)
				}, 'image/png')
			})
		}

		window.downloadRecordedVideo = (filename) => {
			let app = gameApp || lastGameApp
			if (app == null) {
				console.error("gameApp is null, should call startGame first")
				return null
			}
			lastGameApp = null
			app.downloadRecordedVideo(filename)
		}


		window.stopGame = async () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			await gameApp.StopGame()
			lastGameApp = gameApp
			// gameApp = null
		}

		window.pauseGame = () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			gameApp.pause();
		}

		window.resumeGame = () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			gameApp.resume();
		}

		window.stepNextFrame = () => {
			if (gameApp == null) {
				console.error("gameApp is null, should call startGame first")
				return
			}
			gameApp.stepNextFrame();
		}

		// 立即通知父窗口基本方法可用（用于兼容性）
		window.dispatchEvent(new Event('runnerReady'));
	</script>
</body>

</html>
