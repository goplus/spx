  </g>

  <g transform="translate(0 264)">
    <text x="24" y="0" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">Pixel</text>
    <text x="120" y="2" font-family="'Pixel'" font-size="24" fill="#111827">THE QUICK BROWN FOX 012345</text>
  </g>

  <g transform="translate(0 300)">
    <text x="24" y="0" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">Scratch</text>
