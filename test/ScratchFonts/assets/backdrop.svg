    <text x="24" y="0" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">Handwriting</text>
    <text x="120" y="2" font-family="'Handwriting'" font-size="26" fill="#111827">The quick brown fox 012345</text>
  </g>

  <g transform="translate(0 192)">
