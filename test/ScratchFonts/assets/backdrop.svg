<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="480" height="360" viewBox="0 0 480 360">
  <rect width="480" height="360" rx="24" fill="#f7f4ea"/>
  <rect x="16" y="16" width="448" height="328" rx="20" fill="#fffdf7" stroke="#d7d0bf" stroke-width="2"/>
  <text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937">Scratch Font Compatibility</text>
  <text x="30" y="62" font-family="sans-serif" font-size="12" fill="#64748b">All packaged Scratch SVG font families rendered in one demo, including fallback runs.</text>

  <g transform="translate(0 84)">
    <text x="24" y="0" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">Sans Serif</text>
