name: Set up buildctl
description: Build the local buildctl binary and export BUILDCTL for later CI steps.
runs:
  using: composite
  steps:
    - name: Build local buildctl
      shell: bash
      run: |
        set -euo pipefail

        source ./cmd/internal/macos_go_toolchain.sh
        configure_macos_go_toolchain

        if [ -n "${BUILDCTL:-}" ] && [ -x "$BUILDCTL" ]; then
          exit 0
        fi

        buildctl_path="$(pwd)/.bin/buildctl$(go env GOEXE)"

        mkdir -p ./.bin
        macos_go_toolchain_go_build -o "$buildctl_path" ./internal/cmd/buildctl
        echo "BUILDCTL=$buildctl_path" >> "$GITHUB_ENV"
