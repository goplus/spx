name: Set up buildctl
description: Build buildctl from this checkout and expose its executable path.
outputs:
  path:
    description: Absolute path of the buildctl executable
    value: ${{ steps.build.outputs.path }}
runs:
  using: composite
  steps:
    - name: Build local buildctl
      id: build
      shell: bash
      run: bash .github/scripts/setup/build_buildctl.sh
