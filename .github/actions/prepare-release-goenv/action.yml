name: Prepare release goenv
description: Prepare release goenv with rebuilt binaries, release-version source, and dependent modules.
inputs:
  version:
    description: 'Release version without the leading v (for example, 2.0.1)'
    required: true
  platform:
    description: 'Platform name (darwin/windows/linux)'
    required: true
  package-arch:
    description: 'Package architecture name (x86/x64/arm64)'
    required: true
  goenv-dir:
    description: 'Portable goenv directory'
    required: false
    default: goenv
runs:
  using: composite
  steps:
    - name: Prepare release goenv
      shell: bash
      env:
        RELEASE_VERSION: v${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
        PACKAGE_ARCH: ${{ inputs.package-arch }}
        GOENV_DIR: ${{ inputs.goenv-dir }}
        RUNNER_OS_CONTEXT: ${{ runner.os }}
        RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
      run: |
        set -euo pipefail
        source ./.github/actions/lib/release_platform.sh

        GOEXE="$(go_env_goexe)"
        INSTALLED_BIN_DIR="$(go_env_bin_dir "$GOEXE")"
        INSTALLED_SPX="$INSTALLED_BIN_DIR/spx$GOEXE"
        GOENV_ROOT="$(pwd)/$GOENV_DIR"
        GOENV_EXCLUDE="./${GOENV_DIR#./}"
        GOMODCACHE_DIR="$GOENV_ROOT/.cache/mod"
        PACKAGED_BIN_DIR="$GOENV_ROOT/go/bin"
        PACKAGED_SPX="$PACKAGED_BIN_DIR/spx$GOEXE"
        DEST="$GOENV_ROOT/.cache/mod/github.com/goplus/spx/v2@$RELEASE_VERSION"
        SMOKE_LOG_PATH="$GOENV_ROOT/prepare-release-goenv.log"
        TARGET_PLATFORM="$(normalize_platform "$PLATFORM")"
        TARGET_ARCH="$(normalize_arch "$PACKAGE_ARCH")"
        RUNNER_PLATFORM="$(normalize_platform "$RUNNER_OS_CONTEXT")"
        RUNNER_ARCH="$(normalize_arch "$RUNNER_ARCH_CONTEXT")"

        if [ ! -f "$INSTALLED_SPX" ]; then
          log_error "rebuilt spx binary not found: $INSTALLED_SPX"
          exit 1
        fi

        log_section "Prepare release goenv"
        log_info "Runner: $RUNNER_PLATFORM/$RUNNER_ARCH"
        log_info "Package target: $TARGET_PLATFORM/$TARGET_ARCH"
        log_info "Goenv root: $GOENV_ROOT"

        mkdir -p "$GOMODCACHE_DIR" "$PACKAGED_BIN_DIR"

        shopt -s nullglob
        RUNTIME_BINARY_CANDIDATES=("$INSTALLED_BIN_DIR"/gdspxrt*)
        shopt -u nullglob
        RUNTIME_BINARIES=()
        for candidate in "${RUNTIME_BINARY_CANDIDATES[@]}"; do
          if [ -f "$candidate" ]; then
            RUNTIME_BINARIES+=("$candidate")
          fi
        done
        if [ "${#RUNTIME_BINARIES[@]}" -eq 0 ]; then
          log_error "runtime binaries not found in $INSTALLED_BIN_DIR"
          exit 1
        fi

        shopt -s nullglob
        GDSPX_LIBRARY_CANDIDATES=("$INSTALLED_BIN_DIR"/gdspx-*)
        shopt -u nullglob
        GDSPX_LIBRARIES=()
        for candidate in "${GDSPX_LIBRARY_CANDIDATES[@]}"; do
          if [ -f "$candidate" ]; then
            GDSPX_LIBRARIES+=("$candidate")
          fi
        done
        if [ "${#GDSPX_LIBRARIES[@]}" -eq 0 ]; then
          log_error "gdspx shared libraries not found in $INSTALLED_BIN_DIR"
          exit 1
        fi

        cp "${RUNTIME_BINARIES[@]}" "$PACKAGED_BIN_DIR"/
        cp "${GDSPX_LIBRARIES[@]}" "$PACKAGED_BIN_DIR"/
        if [ -f "$INSTALLED_BIN_DIR/runtime.gdextension" ]; then
          cp "$INSTALLED_BIN_DIR/runtime.gdextension" "$PACKAGED_BIN_DIR"/
        fi

        log_info "Installing rebuilt spx binary: $INSTALLED_SPX -> $PACKAGED_SPX"
        cp "$INSTALLED_SPX" "$PACKAGED_SPX"

        log_info "Installing spx source to module cache: $RELEASE_VERSION"
        rm -rf "$DEST"
        mkdir -p "$DEST"

        tar \
          --exclude='./.git' \
          --exclude='./.bin' \
          --exclude='./.github' \
          --exclude='./docs' \
          --exclude="$GOENV_EXCLUDE" \
          --exclude='./test' \
          --exclude='./tutorial' \
          --exclude='./godot' \
          -cf - . | (
            cd "$DEST"
            tar -xf -
          )

        # Set GOMODCACHE so the following smoke run populates the bundled offline cache.
        export GOMODCACHE="$GOMODCACHE_DIR"

        if [ ! -f "$PACKAGED_SPX" ]; then
          log_error "packaged spx binary not found: $PACKAGED_SPX"
          exit 1
        fi

        if [ "$TARGET_PLATFORM" != "$RUNNER_PLATFORM" ] || [ "$TARGET_ARCH" != "$RUNNER_ARCH" ]; then
          log_info "Skipping dependency warm-up on non-native runner"
          log_success "Release goenv preparation completed without smoke run"
          exit 0
        fi

        if ! command -v xgo >/dev/null 2>&1; then
          log_error "xgo is required for native dependency warm-up but was not found in PATH"
          exit 1
        fi

        # Run the smoke test with a bounded timeout so dependency downloads can warm GOMODCACHE.
        log_section "Warm dependency cache"
        log_info "Command: $PACKAGED_SPX runnative --goenv=$GOENV_ROOT --path=test/CI --headless"
        rm -f "$SMOKE_LOG_PATH"
        "$PACKAGED_SPX" runnative --goenv="$GOENV_ROOT" --path=test/CI --headless >"$SMOKE_LOG_PATH" 2>&1 &
        SPX_PID=$!
        EXIT_STATUS=""
        TIMED_OUT=true
        for _ in $(seq 1 30); do
          if ! kill -0 "$SPX_PID" 2>/dev/null; then
            set +e
            wait "$SPX_PID"
            EXIT_STATUS=$?
            set -e
            TIMED_OUT=false
            break
          fi
          sleep 1
        done

        if [ "$TIMED_OUT" = true ]; then
          log_warn "Smoke run exceeded 30s; stopping after warming module cache"
          kill "$SPX_PID" 2>/dev/null || true
          wait "$SPX_PID" 2>/dev/null || true
        elif [ "$EXIT_STATUS" -ne 0 ]; then
          if should_tolerate_windows_gdspxrt_shutdown_exit "$RUNNER_PLATFORM" "$SMOKE_LOG_PATH"; then
            log_warn "Dependency warm-up reached success marker but exited with status $EXIT_STATUS"
            log_info "Continuing because Windows gdspxrt can occasionally fail during shutdown after the project completed"
          else
            log_error "dependency warm-up run failed"
            cat "$SMOKE_LOG_PATH"
            exit 1
          fi
        fi

        if ! find "$GOMODCACHE_DIR" -type d -name '*@*' ! -path "$DEST" -print -quit | grep -q .; then
          log_error "dependency warm-up did not cache any additional modules"
          cat "$SMOKE_LOG_PATH"
          exit 1
        fi

        log_success "Module cache collection completed"
        ls -lah "$GOMODCACHE_DIR" || true
        du -sh "$GOMODCACHE_DIR" || true
