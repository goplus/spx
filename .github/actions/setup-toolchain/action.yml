name: Set up toolchain
description: Install the Go and XGo versions from the runtime lock.
runs:
  using: "composite"
  steps:
    - name: Resolve locked toolchain versions
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail

        if command -v python3 >/dev/null 2>&1; then
          python_command=python3
        elif command -v python >/dev/null 2>&1; then
          python_command=python
        else
          echo "[error] Python 3 is required to read internal/release/runtime.lock.json" >&2
          exit 1
        fi

        "$python_command" .github/scripts/runtime/build_contract.py toolchain \
          --lock internal/release/runtime.lock.json --github-output "$GITHUB_OUTPUT"

    - name: Set up Go and XGo
      uses: goplus/setup-xgo@v1
      with:
        go-version: ${{ steps.toolchain.outputs.go-version }}
        xgo-version: ${{ steps.toolchain.outputs.xgo-version }}
