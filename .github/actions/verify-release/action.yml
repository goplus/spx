name: Verify release package
description: Verify a release package by extracting it and running a smoke test project.
inputs:
  package-file:
    description: 'Path to the release package file'
    required: true
  layout:
    description: 'Package layout: goenv or standalone'
    required: false
    default: goenv
  platform:
    description: 'Platform name (darwin/windows/linux)'
    required: true
  package-arch:
    description: 'Package architecture name (x86/x64/arm64)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Verify release package
      shell: bash
      env:
        PACKAGE_FILE: ${{ inputs.package-file }}
        LAYOUT: ${{ inputs.layout }}
        PLATFORM: ${{ inputs.platform }}
        PACKAGE_ARCH: ${{ inputs.package-arch }}
        RUNNER_OS_CONTEXT: ${{ runner.os }}
        RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
      run: |
        set -euo pipefail
        source ./.github/actions/lib/release_platform.sh

        reset_test_project_state() {
          local project_dir="$1"

          # Warm-up steps earlier in the workflow can leave generated module and
          # engine files in test/CI. Remove them so verification starts from the
          # checked-in sources and regenerates everything inside the package.
          rm -rf "$project_dir/.godot" "$project_dir/go"
          rm -f \
            "$project_dir/go.mod" \
            "$project_dir/go.sum" \
            "$project_dir/project.godot" \
            "$project_dir/xgo_autogen.go"
        }

        assert_macos_binary_arch() {
          local binary_path="$1"
          local expected_arch="$2"
          local actual_archs

          if ! command -v lipo >/dev/null 2>&1; then
            echo "❌ Error: lipo command is required to verify macOS binaries"
            exit 1
          fi

          actual_archs="$(lipo -archs "$binary_path" 2>/dev/null | tr -s '[:space:]' ' ' | sed -e 's/^ //' -e 's/ $//')"
          if [ -z "$actual_archs" ]; then
            echo "❌ Error: failed to inspect macOS binary architecture: $binary_path"
            exit 1
          fi

          case " $actual_archs " in
            *" $expected_arch "*)
              echo "✓ macOS binary architecture matches target: $actual_archs"
              ;;
            *)
              echo "❌ Error: macOS binary architecture mismatch (expected $expected_arch, got $actual_archs)"
              exit 1
              ;;
          esac
        }

        assert_binary_arch() {
          local binary_path="$1"
          local platform="$2"
          local arch="$3"
          local description

          if ! command -v file >/dev/null 2>&1; then
            echo "❌ Error: file command is required to verify binary architecture"
            exit 1
          fi

          description="$(file "$binary_path")"
          echo "Binary architecture: $description"

          case "$platform/$arch" in
            linux/x64)
              case "$description" in
                *"ELF 64-bit"*"x86-64"*) return ;;
              esac
              ;;
            linux/x86)
              case "$description" in
                *"ELF 32-bit"*"Intel 80386"*) return ;;
              esac
              ;;
            linux/arm64)
              case "$description" in
                *"ELF 64-bit"*"ARM aarch64"*) return ;;
              esac
              ;;
            windows/x64)
              case "$description" in
                *"PE32+ executable"*"x86-64"*) return ;;
              esac
              ;;
            windows/x86)
              case "$description" in
                *"PE32 executable"*"Intel 80386"*) return ;;
              esac
              ;;
            macos/x64)
              assert_macos_binary_arch "$binary_path" "x86_64"
              return
              ;;
            macos/arm64)
              assert_macos_binary_arch "$binary_path" "arm64"
              return
              ;;
            *)
              echo "❌ Error: unsupported binary architecture target: $platform/$arch"
              exit 1
              ;;
          esac

          echo "❌ Error: binary architecture mismatch for $platform/$arch"
          exit 1
        }

        echo "=========================================="
        echo "🔍 Verifying release package"
        echo "Package: $PACKAGE_FILE"
        echo "Layout: $LAYOUT"
        echo "Platform: $PLATFORM"
        echo "Package arch: $PACKAGE_ARCH"
        echo "=========================================="
        echo ""

        WORKSPACE_DIR=$(pwd)
        PACKAGE_PATH="$WORKSPACE_DIR/$PACKAGE_FILE"
        if [ -f "$PACKAGE_FILE" ]; then
          PACKAGE_PATH="$PACKAGE_FILE"
        fi

        TARGET_PLATFORM="$(normalize_platform "$PLATFORM")"
        TARGET_ARCH="$(normalize_arch "$PACKAGE_ARCH")"
        RUNNER_PLATFORM="$(normalize_platform "$RUNNER_OS_CONTEXT")"
        RUNNER_ARCH="$(normalize_arch "$RUNNER_ARCH_CONTEXT")"
        VERIFY_BASENAME="release-verification-${LAYOUT}-${TARGET_PLATFORM}-${TARGET_ARCH}"
        VERIFY_ROOT_DIR="$WORKSPACE_DIR/$VERIFY_BASENAME"
        VERIFY_TEST_ROOT_DIR="$VERIFY_ROOT_DIR/test"
        TEST_PROJECT_DIR="$VERIFY_TEST_ROOT_DIR/CI"
        VERIFY_LOG_PATH="$WORKSPACE_DIR/$VERIFY_BASENAME.log"
        STANDALONE_BIN_DIR="$VERIFY_ROOT_DIR/standalone-bin"

        echo "📁 Workspace: $WORKSPACE_DIR"
        echo "🖥️ Runner: $RUNNER_PLATFORM/$RUNNER_ARCH"
        echo "📦 Package target: $TARGET_PLATFORM/$TARGET_ARCH"

        if ! command -v unzip >/dev/null 2>&1; then
          echo "❌ Error: unzip command is required but not available"
          exit 1
        fi

        if [ ! -f "$PACKAGE_PATH" ]; then
          echo "❌ Error: package file not found: $PACKAGE_PATH"
          exit 1
        fi
        echo "✓ Package file found: $PACKAGE_PATH"

        rm -rf "$VERIFY_ROOT_DIR"
        mkdir -p "$VERIFY_ROOT_DIR"
        echo "✓ Created verification directory: $VERIFY_ROOT_DIR"

        echo ""
        echo "📦 Extracting package..."
        unzip -q "$PACKAGE_PATH" -d "$VERIFY_ROOT_DIR"
        echo "✓ Package extracted"

        echo ""
        echo "📂 Extracted top-level contents:"
        ls -la "$VERIFY_ROOT_DIR"

        case "$LAYOUT" in
          goenv)
            if [ ! -d "$VERIFY_ROOT_DIR/go/bin" ]; then
              echo "❌ Error: go/bin directory not found in extracted package"
              exit 1
            fi

            if [ ! -d "$VERIFY_ROOT_DIR/gotoolchain/go" ]; then
              echo "❌ Error: portable Go toolchain not found in extracted package"
              exit 1
            fi

            echo ""
            echo "📂 Go bin directory:"
            ls -la "$VERIFY_ROOT_DIR/go/bin"
            echo ""
            echo "📂 Go toolchain directory:"
            ls -la "$VERIFY_ROOT_DIR/gotoolchain"

            case "$TARGET_PLATFORM" in
              windows)
                SPX_BIN_PATH="$VERIFY_ROOT_DIR/go/bin/spx.exe"
                ;;
              macos|linux)
                SPX_BIN_PATH="$VERIFY_ROOT_DIR/go/bin/spx"
                ;;
              *)
                echo "❌ Error: unsupported platform: $TARGET_PLATFORM"
                exit 1
                ;;
            esac
            ;;
          standalone)
            case "$TARGET_PLATFORM" in
              windows)
                SPX_BIN_PATH="$VERIFY_ROOT_DIR/spx.exe"
                ;;
              macos|linux)
                SPX_BIN_PATH="$VERIFY_ROOT_DIR/spx"
                ;;
              *)
                echo "❌ Error: unsupported platform: $TARGET_PLATFORM"
                exit 1
                ;;
            esac
            ;;
          *)
            echo "❌ Error: unsupported package layout: $LAYOUT"
            exit 1
            ;;
        esac

        if [ ! -f "$SPX_BIN_PATH" ]; then
          echo "❌ Error: spx executable not found: $SPX_BIN_PATH"
          exit 1
        fi
        echo "✓ SPX executable found: $SPX_BIN_PATH"

        if [ "$LAYOUT" = "standalone" ] || [ "$TARGET_PLATFORM" = "macos" ]; then
          assert_binary_arch "$SPX_BIN_PATH" "$TARGET_PLATFORM" "$TARGET_ARCH"
        fi

        if [ "$TARGET_PLATFORM" != "windows" ]; then
          chmod +x "$SPX_BIN_PATH"
        fi

        echo ""
        echo "📋 Preparing test project..."
        mkdir -p "$VERIFY_TEST_ROOT_DIR"
        cp -R test/CI "$VERIFY_TEST_ROOT_DIR/"
        reset_test_project_state "$TEST_PROJECT_DIR"
        echo "✓ Test project copied"

        if [ "$TARGET_PLATFORM" != "$RUNNER_PLATFORM" ] || [ "$TARGET_ARCH" != "$RUNNER_ARCH" ]; then
          echo ""
          echo "⏭️ Skipping smoke test on non-native runner"
          echo "Runner platform/arch does not match package target."
          echo "Structure verification completed successfully."
          echo ""
          echo "=========================================="
          echo "✅ Release package verification PASSED"
          echo "=========================================="
          exit 0
        fi

        mkdir -p "$STANDALONE_BIN_DIR"
        STANDALONE_SPX="$STANDALONE_BIN_DIR/$(basename "$SPX_BIN_PATH")"
        cp "$SPX_BIN_PATH" "$STANDALONE_SPX"
        if [ "$TARGET_PLATFORM" != "windows" ]; then
          chmod +x "$STANDALONE_SPX"
        fi

        echo ""
        echo "🚀 Running smoke test..."
        echo "Command: $STANDALONE_SPX run --path=$TEST_PROJECT_DIR --headless"
        echo ""

        rm -f "$VERIFY_LOG_PATH"
        set +e
        "$STANDALONE_SPX" run --path="$TEST_PROJECT_DIR" --headless 2>&1 | tee "$VERIFY_LOG_PATH"
        SPX_STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$SPX_STATUS" -ne 0 ]; then
          echo "❌ Error: smoke test command failed (exit $SPX_STATUS)"
          exit 1
        fi

        if ! grep -q "===>SpxCIRunSucc" "$VERIFY_LOG_PATH"; then
          echo "❌ Error: smoke test success marker not found"
          echo "Smoke test log:"
          cat "$VERIFY_LOG_PATH"
          exit 1
        fi
        echo "✓ Smoke test success marker found"

        echo ""
        echo "=========================================="
        echo "✅ Release package verification PASSED"
        echo "=========================================="
