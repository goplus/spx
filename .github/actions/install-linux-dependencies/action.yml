name: Install Linux dependencies
description: Install APT packages with bounded retries and hard timeouts

inputs:
  profile:
    description: Predefined package set (web or native)
    required: true

runs:
  using: composite
  steps:
    - name: Install APT packages
      shell: bash
      env:
        APT_PROFILE: ${{ inputs.profile }}
      run: bash .github/scripts/setup/install_linux_dependencies.sh
