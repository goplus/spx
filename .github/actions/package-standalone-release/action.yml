name: Package standalone spx
description: Package the rebuilt standalone-capable spx binary into a zip archive.
inputs:
  package-file:
    description: 'Output zip archive path'
    required: true
  spx-bin:
    description: 'Path to the rebuilt standalone-capable spx binary'
    required: true
runs:
  using: composite
  steps:
    - name: Package standalone spx
      shell: bash
      env:
        PACKAGE_FILE: ${{ inputs.package-file }}
        SPX_BIN: ${{ inputs.spx-bin }}
      run: |
        set -euo pipefail
        source ./.github/actions/lib/release_platform.sh

        if [ -z "$SPX_BIN" ]; then
          log_error "spx-bin input is empty"
          exit 1
        fi

        SPX_BIN_PATH="$(normalize_path "$SPX_BIN")"
        SPX_BIN_NAME="$(basename "$SPX_BIN_PATH")"
        PACKAGE_PATH="$(pwd)/$PACKAGE_FILE"
        STAGING_DIR="$(pwd)/standalone-package"

        if [ ! -f "$SPX_BIN_PATH" ]; then
          log_error "spx binary not found: $SPX_BIN_PATH"
          exit 1
        fi

        log_section "Package standalone spx"
        log_info "SPX binary: $SPX_BIN_PATH"
        log_info "Package: $PACKAGE_PATH"

        rm -rf "$STAGING_DIR" "$PACKAGE_PATH"
        mkdir -p "$STAGING_DIR"
        cp "$SPX_BIN_PATH" "$STAGING_DIR/"

        if command -v zip >/dev/null 2>&1; then
          (
            cd "$STAGING_DIR"
            zip -r "$PACKAGE_PATH" "$SPX_BIN_NAME"
          )
          log_success "Packaged standalone spx: $PACKAGE_PATH"
          exit 0
        fi

        if [ "$SPX_BIN_NAME" = "spx.exe" ] && command -v powershell.exe >/dev/null 2>&1; then
          PACKAGE_PATH_WIN="$(normalize_windows_path "$PACKAGE_PATH")"
          STAGING_DIR_WIN="$(normalize_windows_path "$STAGING_DIR")"
          powershell.exe -NoLogo -NoProfile -Command \
            "Compress-Archive -LiteralPath (Join-Path '$STAGING_DIR_WIN' '$SPX_BIN_NAME') -DestinationPath '$PACKAGE_PATH_WIN' -Force"
          log_success "Packaged standalone spx: $PACKAGE_PATH"
          exit 0
        fi

        log_error "neither zip nor a Windows PowerShell zip fallback is available"
        exit 1
