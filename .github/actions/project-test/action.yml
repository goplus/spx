name: Test Godot project
description: Run the test Godot project.
runs:
  using: "composite"
  steps:
    - name: Setup cgo toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        GCC_BIN="$(command -v gcc || true)"
        if [ -z "$GCC_BIN" ]; then
          echo "Error: gcc not found in PATH"
          exit 1
        fi

        if command -v cygpath >/dev/null 2>&1; then
          GCC_BIN="$(cygpath -w "$GCC_BIN")"
        fi

        echo "CC=$GCC_BIN" >> "$GITHUB_ENV"
        echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
        echo "Using CC=$GCC_BIN"

    - name: GenGo
      shell: bash
      run: CGO_ENABLED=1 xgo go ./...

    - name: Run test demo
      shell: bash
      run: ${SPX_BIN:-spx} run -path="test/CI" -headless=true 2>&1 | tee cilog.txt

    - name: Check test result
      shell: bash
      run: |
        if grep -q "===>SpxCIRunSucc" cilog.txt; then
          echo "test success"
          rm -f cilog.txt
        else
          echo "test failed: not found success mark"
          cat cilog.txt
          rm -f cilog.txt
          exit 1
        fi

    - name: Run test demo in interpreted mode
      shell: bash
      run: |
        ${SPX_BIN:-spx} runi -path="test/CI" -headless=true 2>&1 | tee cilog_interpreted_mode.txt

    - name: Check test result in interpreted mode
      shell: bash
      run: |
        if grep -q "===>SpxCIRunSucc" cilog_interpreted_mode.txt; then
          echo "test success"
          rm -f cilog_interpreted_mode.txt
        else
          echo "test failed: not found success mark"
          cat cilog_interpreted_mode.txt
          rm -f cilog_interpreted_mode.txt
          exit 1
        fi
