name: Test Godot project
description: Run the test Godot project.
runs:
  using: "composite"
  steps:
    - name: GenGo
      shell: bash
      run: xgo go ./...

    - name: Run project tests
      shell: bash
      run: |
        set -euo pipefail
        source ./.github/actions/lib/release_platform.sh

        run_project_test() {
          local name="$1"
          local log_path="$2"
          local status
          shift 2

          log_section "$name"
          rm -f "$log_path"

          set +e
          "$@" 2>&1 | tee "$log_path"
          status=${PIPESTATUS[0]}
          set -e

          if spx_run_reached_success "$log_path"; then
            log_success "$name succeeded"
            rm -f "$log_path"
            return
          fi

          log_error "$name failed: Success marker not found (exit $status)"
          cat "$log_path"
          rm -f "$log_path"
          exit 1
        }

        run_project_test "Native project test" native-project-test.log \
          spx runnative -path="test/CI" -headless=true
        run_project_test "Interpreted project test" interpreted-project-test.log \
          spx run -path="test/CI" -headless=true
