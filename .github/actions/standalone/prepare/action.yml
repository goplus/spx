name: Prepare standalone release
description: Prepare runtime assets, reinstall spx, and expose the rebuilt binary path.
inputs:
  engine-asset-dir:
    description: 'Optional directory containing engine artifacts from the current workflow run'
    required: false
    default: ''
outputs:
  spx-bin:
    description: 'Path to the rebuilt spx binary'
    value: ${{ steps.prepare-standalone-release.outputs.spx-bin }}
runs:
  using: "composite"
  steps:
    - name: Build local buildctl
      uses: ./.github/actions/setup-buildctl

    - name: Prepare runtime assets and install spx
      id: prepare-standalone-release
      shell: bash
      env:
        ENGINE_ASSET_DIR: ${{ inputs.engine-asset-dir }}
      run: |
        set -euo pipefail
        source ./.github/actions/standalone/lib/platform.sh

        log_section "Prepare standalone release"
        log_info "Workspace: $(pwd)"

        log_info "Preparing runtime assets and reinstalling spx"
        setup_args=(host)
        if [ -n "$ENGINE_ASSET_DIR" ]; then
          setup_args+=(--asset-dir "$ENGINE_ASSET_DIR")
        else
          setup_args+=(--published-runtime)
        fi
        "$BUILDCTL" setup "${setup_args[@]}"

        GOEXE="$(go_env_goexe)"
        SPX_BIN_PATH="$(go_env_spx_path "$GOEXE")"
        if [ ! -f "$SPX_BIN_PATH" ]; then
          log_error "Rebuilt SPX binary not found: $SPX_BIN_PATH"
          exit 1
        fi
        echo "spx-bin=$SPX_BIN_PATH" >> "$GITHUB_OUTPUT"
        log_success "Rebuilt spx binary: $SPX_BIN_PATH"
