name: Verify release package
description: Verify standalone release package structure and architecture, and smoke-test it on native runners.
inputs:
  package-file:
    description: 'Path to the release package file'
    required: true
  platform:
    description: 'Platform name (darwin/windows/linux)'
    required: true
  package-arch:
    description: 'Package architecture name (x86/x64/arm64)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Verify release package
      shell: bash
      env:
        PACKAGE_FILE: ${{ inputs.package-file }}
        PLATFORM: ${{ inputs.platform }}
        PACKAGE_ARCH: ${{ inputs.package-arch }}
        RUNNER_OS_CONTEXT: ${{ runner.os }}
        RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
      run: |
        set -euo pipefail
        source ./.github/actions/standalone/lib/platform.sh

        reset_test_project_state() {
          local project_dir="$1"

          rm -rf "$project_dir/.godot" "$project_dir/go"
          rm -f \
            "$project_dir/go.mod" \
            "$project_dir/go.sum" \
            "$project_dir/project.godot" \
            "$project_dir/xgo_autogen.go"
        }

        require_command() {
          local command_name="$1"

          if ! command -v "$command_name" >/dev/null 2>&1; then
            log_error "Command not available: $command_name"
            exit 1
          fi
        }

        resolve_package_path() {
          local package_file="$1"
          local workspace_dir="$2"

          if [ -f "$package_file" ]; then
            printf '%s\n' "$package_file"
            return
          fi

          if [ -f "$workspace_dir/$package_file" ]; then
            printf '%s\n' "$workspace_dir/$package_file"
            return
          fi

          log_error "Package file not found: $package_file"
          exit 1
        }

        log_verification_context() {
          log_section "Verify release package"
          log_info "Package: $PACKAGE_FILE"
          log_info "Platform: $PLATFORM"
          log_info "Package arch: $PACKAGE_ARCH"
          log_info "Workspace: $WORKSPACE_DIR"
          log_info "Runner: $RUNNER_PLATFORM/$RUNNER_ARCH"
          log_info "Package target: $TARGET_PLATFORM/$TARGET_ARCH"
        }

        extract_package() {
          local package_path="$1"
          local verify_root_dir="$2"

          rm -rf "$verify_root_dir"
          mkdir -p "$verify_root_dir"
          log_success "Verification directory created: $verify_root_dir"

          log_section "Extract package"
          unzip -q "$package_path" -d "$verify_root_dir"
          log_success "Package extracted"

          log_info "Extracted top-level contents:"
          ls -la "$verify_root_dir"
        }

        verify_standalone_binary() {
          local spx_bin_path="$1"
          local target_platform="$2"
          local target_arch="$3"

          log_section "Verify standalone binary"
          if [ ! -f "$spx_bin_path" ]; then
            log_error "SPX executable not found: $spx_bin_path"
            exit 1
          fi
          log_success "SPX executable found: $spx_bin_path"

          assert_binary_arch "$spx_bin_path" "$target_platform" "$target_arch"

          if [ "$target_platform" != "windows" ]; then
            chmod +x "$spx_bin_path"
          fi
          log_success "SPX executable permissions prepared"
        }

        should_run_smoke_test() {
          local target_platform="$1"
          local target_arch="$2"
          local runner_platform="$3"
          local runner_arch="$4"

          [ "$target_platform" = "$runner_platform" ] && [ "$target_arch" = "$runner_arch" ]
        }

        prepare_test_project() {
          local verify_test_root_dir="$1"
          local test_project_dir="$2"
          local spx_source_dir
          local spx_version

          log_section "Prepare test project"
          mkdir -p "$verify_test_root_dir"
          cp -R test/CI "$verify_test_root_dir/"
          reset_test_project_state "$test_project_dir"

          spx_version="$(go run ./.github/scripts/runtime/version.go --spx-version)"
          spx_source_dir="$WORKSPACE_DIR"
          if command -v cygpath >/dev/null 2>&1; then
            spx_source_dir="$(cygpath -m "$spx_source_dir")"
          fi
          cat > "$test_project_dir/go.mod" <<EOF
        module github.com/goplus/spx-release-smoke-test

        go 1.25.0

        require github.com/goplus/spx/v3 $spx_version //xgo:class

        replace github.com/goplus/spx/v3 => $spx_source_dir
        EOF
          log_info "Smoke test uses local SPX source for unpublished $spx_version"
          log_success "Test project prepared: $test_project_dir"
        }

        stage_standalone_binary() {
          local spx_bin_path="$1"
          local target_platform="$2"
          local standalone_bin_dir="$3"

          log_section "Stage standalone binary"
          mkdir -p "$standalone_bin_dir"
          STANDALONE_SPX="$standalone_bin_dir/$(basename "$spx_bin_path")"
          cp "$spx_bin_path" "$STANDALONE_SPX"
          if [ "$target_platform" != "windows" ]; then
            chmod +x "$STANDALONE_SPX"
          fi
          log_success "Standalone binary staged: $STANDALONE_SPX"
        }

        assert_smoke_test_result() {
          local spx_status="$1"
          local log_path="$2"
          local runner_platform="$3"
          local smoke_reached_success

          smoke_reached_success=false
          if spx_run_reached_success "$log_path"; then
            smoke_reached_success=true
          fi

          if [ "$spx_status" -ne 0 ]; then
            if should_tolerate_windows_gdspxrt_shutdown_exit "$runner_platform" "$log_path"; then
              log_warn "Smoke test reached success marker but exited with status $spx_status"
              log_info "Continuing because Windows gdspxrt can occasionally fail during shutdown after the project completed"
            else
              log_error "Smoke test command failed (exit $spx_status)"
              log_info "Smoke test log:"
              cat "$log_path"
              exit 1
            fi
          fi

          if [ "$smoke_reached_success" != true ]; then
            log_error "Smoke test success marker not found"
            log_info "Smoke test log:"
            cat "$log_path"
            exit 1
          fi
          log_success "Smoke test success marker found"
        }

        run_smoke_test() {
          local standalone_spx="$1"
          local test_project_dir="$2"
          local log_path="$3"
          local runner_platform="$4"
          local spx_status

          log_section "Run smoke test"
          log_info "Command: $standalone_spx run --path=$test_project_dir --headless"

          rm -f "$log_path"
          set +e
          "$standalone_spx" run --path="$test_project_dir" --headless 2>&1 | tee "$log_path"
          spx_status=${PIPESTATUS[0]}
          set -e

          assert_smoke_test_result "$spx_status" "$log_path" "$runner_platform"
        }

        WORKSPACE_DIR=$(pwd)
        TARGET_PLATFORM="$(normalize_platform "$PLATFORM")"
        TARGET_ARCH="$(normalize_arch "$PACKAGE_ARCH")"
        RUNNER_PLATFORM="$(normalize_platform "$RUNNER_OS_CONTEXT")"
        RUNNER_ARCH="$(normalize_arch "$RUNNER_ARCH_CONTEXT")"
        SPX_BINARY_NAME="$(spx_binary_name_for_platform "$TARGET_PLATFORM")"
        VERIFY_BASENAME="release-verification-${TARGET_PLATFORM}-${TARGET_ARCH}"
        VERIFY_ROOT_DIR="$WORKSPACE_DIR/$VERIFY_BASENAME"
        VERIFY_TEST_ROOT_DIR="$VERIFY_ROOT_DIR/test"
        TEST_PROJECT_DIR="$VERIFY_TEST_ROOT_DIR/CI"
        VERIFY_LOG_PATH="$WORKSPACE_DIR/$VERIFY_BASENAME.log"
        STANDALONE_BIN_DIR="$VERIFY_ROOT_DIR/standalone-bin"
        STANDALONE_SPX=""

        PACKAGE_PATH="$(resolve_package_path "$PACKAGE_FILE" "$WORKSPACE_DIR")"

        log_verification_context
        require_command unzip
        log_success "Package file found: $PACKAGE_PATH"

        extract_package "$PACKAGE_PATH" "$VERIFY_ROOT_DIR"

        SPX_BIN_PATH="$VERIFY_ROOT_DIR/$SPX_BINARY_NAME"
        verify_standalone_binary "$SPX_BIN_PATH" "$TARGET_PLATFORM" "$TARGET_ARCH"

        if ! should_run_smoke_test "$TARGET_PLATFORM" "$TARGET_ARCH" "$RUNNER_PLATFORM" "$RUNNER_ARCH"; then
          log_info "Skipping smoke test on non-native runner"
          log_info "Runner platform/arch does not match package target"
          log_success "Release package verification passed"
          exit 0
        fi

        prepare_test_project "$VERIFY_TEST_ROOT_DIR" "$TEST_PROJECT_DIR"
        stage_standalone_binary "$SPX_BIN_PATH" "$TARGET_PLATFORM" "$STANDALONE_BIN_DIR"
        run_smoke_test "$STANDALONE_SPX" "$TEST_PROJECT_DIR" "$VERIFY_LOG_PATH" "$RUNNER_PLATFORM"

        log_success "Release package verification passed"
