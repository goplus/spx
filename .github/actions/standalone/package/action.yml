name: Package standalone release
description: Package the rebuilt standalone-capable spx binary into a zip archive.
inputs:
  package-file:
    description: 'Output zip archive path'
    required: true
  spx-bin:
    description: 'Path to the rebuilt standalone-capable spx binary'
    required: true
runs:
  using: composite
  steps:
    - name: Package standalone release
      shell: bash
      env:
        PACKAGE_FILE: ${{ inputs.package-file }}
        SPX_BIN: ${{ inputs.spx-bin }}
      run: |
        set -euo pipefail
        source ./.github/actions/standalone/lib/platform.sh

        if [ -z "$SPX_BIN" ]; then
          log_error "SPX binary input is empty"
          exit 1
        fi

        SPX_BIN_PATH="$(normalize_path "$SPX_BIN")"
        SPX_BIN_NAME="$(basename "$SPX_BIN_PATH")"
        PACKAGE_PATH="$(pwd)/$PACKAGE_FILE"

        if [ ! -f "$SPX_BIN_PATH" ]; then
          log_error "SPX binary not found: $SPX_BIN_PATH"
          exit 1
        fi

        log_section "Package standalone release"
        log_info "SPX binary: $SPX_BIN_PATH"
        log_info "Package: $PACKAGE_PATH"

        rm -f "$PACKAGE_PATH"

        if command -v zip >/dev/null 2>&1; then
          zip -j "$PACKAGE_PATH" "$SPX_BIN_PATH"
        elif [ "$SPX_BIN_NAME" = "spx.exe" ] && command -v powershell.exe >/dev/null 2>&1; then
          SPX_BIN_PATH_WIN="$(normalize_windows_path "$SPX_BIN_PATH")" \
          PACKAGE_PATH_WIN="$(normalize_windows_path "$PACKAGE_PATH")" \
          powershell.exe -NoLogo -NoProfile -Command \
            'Compress-Archive -LiteralPath $env:SPX_BIN_PATH_WIN -DestinationPath $env:PACKAGE_PATH_WIN -Force'
        else
          log_error "Neither zip nor a Windows PowerShell zip fallback is available"
          exit 1
        fi

        log_success "Packaged standalone SPX: $PACKAGE_PATH"
