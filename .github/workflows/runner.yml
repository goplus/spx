name: 🔗 GHA
on: [push, pull_request, merge_group]

permissions:
  contents: read

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-runner
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    uses: ./.github/workflows/static_checks.yml

  go-builds:
    name: Go builds
    uses: ./.github/workflows/go_builds.yml

  runtime-resolution:
    name: Resolve published runtime
    runs-on: ubuntu-22.04
    outputs:
      runtime_state: ${{ steps.runtime.outputs.runtime_state }}
      runtime_reason: ${{ steps.runtime.outputs.runtime_reason }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate current runtime lock snapshot
        run: python3 .github/scripts/runtime_lock_snapshot.py check

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Resolve runtime release
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./.github/scripts/runtime/resolution.go \
            --lock internal/release/runtime.lock.json \
            --repo-root . \
            --revision HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Report runtime CI policy
        env:
          RUNTIME_REASON: ${{ steps.runtime.outputs.runtime_reason }}
          RUNTIME_STATE: ${{ steps.runtime.outputs.runtime_state }}
        run: |
          {
            echo "### Runtime CI policy"
            echo
            echo "- State: \`$RUNTIME_STATE\`"
            echo "- Reason: $RUNTIME_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  spx-module-integration:
    name: Current SPX module integration
    needs: [static-checks, runtime-resolution]
    # Job conditions implicitly require every dependency to succeed; this only
    # selects the runtime path.
    if: needs.runtime-resolution.outputs.runtime_state == 'missing'
    uses: ./.github/workflows/spx_module_integration.yml

  web-build:
    name: Published Web runtime smoke
    needs: [static-checks, runtime-resolution]
    if: needs.runtime-resolution.outputs.runtime_state == 'ready'
    uses: ./.github/workflows/build_web.yml

  ci-gate:
    if: always()
    needs:
      - static-checks
      - go-builds
      - runtime-resolution
      - spx-module-integration
      - web-build
    name: CI gate
    runs-on: ubuntu-22.04
    steps:
      - name: Verify required CI path passed
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          GO_BUILDS_RESULT: ${{ needs.go-builds.result }}
          RUNTIME_RESOLUTION_RESULT: ${{ needs.runtime-resolution.result }}
          RUNTIME_STATE: ${{ needs.runtime-resolution.outputs.runtime_state }}
          RUNTIME_REASON: ${{ needs.runtime-resolution.outputs.runtime_reason }}
          MODULE_INTEGRATION_RESULT: ${{ needs.spx-module-integration.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
        run: |
          set -euo pipefail

          require_result() {
            local job_name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "[error] $job_name result is $actual, want $expected" >&2
              exit 1
            fi
          }

          require_result static-checks "$STATIC_CHECKS_RESULT" success
          require_result go-builds "$GO_BUILDS_RESULT" success
          require_result runtime-resolution "$RUNTIME_RESOLUTION_RESULT" success

          case "$RUNTIME_STATE" in
            ready)
              require_result spx-module-integration "$MODULE_INTEGRATION_RESULT" skipped
              require_result web-build "$WEB_BUILD_RESULT" success
              echo "[ok] Published runtime verified; Web normal smoke passed"
              ;;
            missing)
              require_result spx-module-integration "$MODULE_INTEGRATION_RESULT" success
              require_result web-build "$WEB_BUILD_RESULT" skipped
              echo "[ok] Runtime is unpublished; current SPX module integration passed"
              ;;
            *)
              echo "[error] Unknown runtime state: ${RUNTIME_STATE:-<empty>}" >&2
              exit 1
              ;;
          esac

          echo "[info] Runtime resolution: $RUNTIME_REASON"
