name: Build Web Bundles

on:
  workflow_call:
    inputs:
      engine_artifacts:
        description: 'Use Godot engine artifacts produced by the current workflow run'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-web
  cancel-in-progress: true

jobs:
  web-build:
    name: Build web bundle (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: normal
            zip_file: spx_web.zip
            artifact_name: web-release
            runtime_artifact: runtime-web
            display_name: Web Release
          - mode: worker
            zip_file: spx_web_worker.zip
            artifact_name: web-worker-release
            runtime_artifact: runtime-web-worker
            display_name: Web Worker Release
          - mode: minigame
            zip_file: spx_web_minigame.zip
            artifact_name: web-minigame-release
            runtime_artifact: runtime-web-minigame
            display_name: Web Minigame Release
          - mode: miniprogram
            zip_file: spx_web_miniprogram.zip
            artifact_name: web-miniprogram-release
            runtime_artifact: runtime-web-miniprogram
            display_name: Web Miniprogram Release
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download current-run host editor
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          name: runtime-editor-linux-x86_64
          path: runtime-assets

      - name: Download current-run Web template
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.runtime_artifact }}
          path: runtime-assets

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev binaryen brotli
        if: ${{ runner.os == 'Linux' }}

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: web
          web-mode: ${{ matrix.mode }}
          engine-asset-dir: ${{ inputs.engine_artifacts && 'runtime-assets' || '' }}

      - name: Build release bundle
        env:
          MATRIX_MODE: ${{ matrix.mode }}
        run: |
          "$BUILDCTL" runtime export-web --mode "$MATRIX_MODE"
          if [ ! -f "${{ matrix.zip_file }}" ]; then
            echo "[error] Release bundle not found: ${{ matrix.zip_file }}" >&2
            exit 1
          fi
          echo "[ok] Release bundle built: ${{ matrix.zip_file }}"

      - name: Verify release bundle
        run: unzip -t "${{ matrix.zip_file }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_file }}
          retention-days: 14
