name: Build iOS IPA

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-ios
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up toolchain and engine assets
      uses: ./.github/actions/deps

    - name: Set up Vulkan SDK
      run: |
        echo "[info] Installing Vulkan SDK for MoltenVK support"
        # Install jq if not available
        if ! command -v jq &> /dev/null; then
          brew install jq
        fi

        # Check if Vulkan SDK is already installed
        if [ -d "$HOME/VulkanSDK" ] && [ "$(ls -A $HOME/VulkanSDK 2>/dev/null)" ]; then
          echo "[ok] Vulkan SDK already installed"
          exit 0
        fi

        # Download and install Vulkan SDK
        echo "[info] Downloading Vulkan SDK"
        curl -L "https://sdk.lunarg.com/sdk/download/latest/mac/config.json" -o /tmp/vulkan-sdk.json
        VULKAN_VERSION=$(jq -r '.version' /tmp/vulkan-sdk.json)
        echo "[info] Vulkan SDK version: $VULKAN_VERSION"

        curl -L "https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip" -o /tmp/vulkan-sdk.zip
        unzip -q /tmp/vulkan-sdk.zip -d /tmp

        if [ -d "/tmp/vulkansdk-macOS-$VULKAN_VERSION.app" ]; then
          /tmp/vulkansdk-macOS-$VULKAN_VERSION.app/Contents/MacOS/vulkansdk-macOS-$VULKAN_VERSION \
            --accept-licenses --default-answer --confirm-command install
          echo "[ok] Vulkan SDK installed: $VULKAN_VERSION"
        else
          echo "[error] Vulkan SDK installer not found" >&2
          exit 1
        fi

        # Cleanup
        rm -f /tmp/vulkan-sdk.json /tmp/vulkan-sdk.zip
        rm -rf /tmp/vulkansdk-macOS-$VULKAN_VERSION.app

    - name: Download iOS export templates
      run: |
        echo "[info] Downloading iOS engine templates"
        "$BUILDCTL" engine download --platform ios
        echo "[info] Downloaded template directory:"
        ls -la ~/Library/Application\ Support/Godot/export_templates/

    - name: Configure iOS export preset
      shell: bash
      run: |
        echo "[info] Configuring iOS export preset for CI"
        cd cmd/spx/template/project
        # Backup original preset
        cp export_presets.cfg export_presets.cfg.bak
        # Enable export_project_only to skip code signing
        sed -i.tmp 's/application\/export_project_only=false/application\/export_project_only=true/' export_presets.cfg
        rm -f export_presets.cfg.tmp
        echo "[info] Updated export preset:"
        grep -A 25 "\[preset.0.options\]" export_presets.cfg | head -100

    - name: Export Xcode project
      shell: bash
      run: |
        "$BUILDCTL" tool install
        cd tutorial/00-Hello
        spx exportios 2>&1 | tee build_ios.txt || true

    - name: Copy MoltenVK framework
      shell: bash
      run: |
        echo "[info] Copying MoltenVK.xcframework to Xcode project"
        XCODE_BUILD_DIR="tutorial/00-Hello/project/.builds/ios"

        # Find Vulkan SDK installation
        VULKAN_SDK=$(find ~/VulkanSDK -maxdepth 1 -type d -name "[0-9]*" | head -1)
        echo "[info] Vulkan SDK path: $VULKAN_SDK"

        if [ -z "$VULKAN_SDK" ]; then
          echo "[error] Vulkan SDK not found" >&2
          exit 1
        fi

        # Copy MoltenVK.xcframework
        MOLTENVK_SOURCE="$VULKAN_SDK/macOS/lib/MoltenVK.xcframework"
        if [ -d "$MOLTENVK_SOURCE" ]; then
          echo "[info] MoltenVK source: $MOLTENVK_SOURCE"
          cp -r "$MOLTENVK_SOURCE" "$XCODE_BUILD_DIR/"
          echo "[ok] MoltenVK.xcframework copied"
          ls -la "$XCODE_BUILD_DIR/MoltenVK.xcframework"
        else
          echo "[error] MoltenVK.xcframework not found: $MOLTENVK_SOURCE" >&2
          echo "[info] Vulkan SDK MoltenVK candidates:"
          find "$VULKAN_SDK" -name "*MoltenVK*" -type d
          exit 1
        fi

    - name: Build unsigned IPA
      shell: bash
      run: |
        set -o pipefail
        echo "[info] Building IPA from Xcode project"
        XCODE_PROJECT="tutorial/00-Hello/project/.builds/ios/Game.xcodeproj"
        IPA_DIR="tutorial/00-Hello/project/.builds/ios"

        if [ ! -d "$XCODE_PROJECT" ]; then
          echo "[error] Xcode project not found: $XCODE_PROJECT" >&2
          exit 1
        fi

        echo "[ok] Xcode project found"
        echo "[info] Building without code signing"
        cd "$(dirname "$XCODE_PROJECT")"

        # Build for iOS device without code signing
        {
          echo
          echo "[info] Starting xcodebuild"
        } | tee -a "$GITHUB_WORKSPACE/tutorial/00-Hello/build_ios.txt"
        if ! xcodebuild -project "$(basename "$XCODE_PROJECT")" \
          -scheme Game \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee -a "$GITHUB_WORKSPACE/tutorial/00-Hello/build_ios.txt"; then
          echo "[error] xcodebuild failed" >&2
          echo "[info] Last 50 lines of build_ios.txt:"
          tail -50 "$GITHUB_WORKSPACE/tutorial/00-Hello/build_ios.txt" || true
          exit 1
        fi

        # Find the app bundle in DerivedData
        echo "[info] Searching for Game.app in DerivedData"
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Game.app" -path "*/Debug-iphoneos/*" -type d | head -1)

        if [ -z "$APP_PATH" ]; then
          echo "[error] Game.app not found in DerivedData" >&2
          echo "[info] Game.app candidates:"
          find ~/Library/Developer/Xcode/DerivedData -name "Game.app" -type d
          exit 1
        fi

        echo "[ok] App bundle found: $APP_PATH"
        ls -lh "$APP_PATH"

        # Create IPA manually from app bundle
        echo "[info] Creating IPA from app bundle"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r Game.ipa Payload
        rm -rf Payload
        echo "[ok] IPA created"
        ls -lh Game.ipa

    - name: Verify IPA output
      shell: bash
      run: |
        echo "[info] Checking IPA output"
        IPA_DIR="tutorial/00-Hello/project/.builds/ios"

        if [ ! -d "$IPA_DIR" ]; then
          echo "[error] Build directory not found: $IPA_DIR" >&2
          exit 1
        fi

        echo "[info] Build directory contents:"
        ls -la "$IPA_DIR"

        IPA_COUNT=$(find "$IPA_DIR" -name "*.ipa" -type f | wc -l)

        if [ "$IPA_COUNT" -eq 0 ]; then
          echo "[error] No IPA file found in $IPA_DIR" >&2
          echo "[error] Build failed; no IPA was generated" >&2
          exit 1
        fi

        echo "[ok] Found $IPA_COUNT IPA file(s)"
        find "$IPA_DIR" -name "*.ipa" -type f -exec ls -lh {} \;

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ios-ipa
        path: tutorial/00-Hello/project/.builds/ios/*.ipa
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ios-build-log
        path: tutorial/00-Hello/build_ios.txt
        if-no-files-found: warn
