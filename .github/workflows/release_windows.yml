name: Package Windows

on:
  workflow_call:
    inputs:
      engine_artifacts:
        description: 'Use Godot engine artifacts produced by the current workflow run'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-windows
  cancel-in-progress: true

jobs:
  windows-standalone:
    name: Package Windows standalone
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download current-run engine artifacts
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: runtime-*windows-x86_64
          path: runtime-assets
          merge-multiple: true

      - name: Download current-run runtime pack
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          name: runtime-spx-assets
          path: runtime-assets

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            zip
            unzip
            bash

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/prepare-standalone-release
        with:
          engine-asset-dir: ${{ inputs.engine_artifacts && 'runtime-assets' || '' }}

      - name: Package standalone release
        uses: ./.github/actions/package-standalone-release
        with:
          package-file: spx-standalone-windows-x64.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Verify standalone release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-standalone-windows-x64.zip
          platform: windows
          package-arch: x64

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-windows-x64
          path: spx-standalone-windows-x64.zip
          retention-days: 14
