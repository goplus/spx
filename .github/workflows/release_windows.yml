name: Release Windows Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-windows
  cancel-in-progress: true

jobs:
  windows-goenv:
    name: Package Windows goenv (${{ matrix.arch_name }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: 386
            arch_name: x86
            standalone: false
          - arch: amd64
            arch_name: x64
            standalone: true
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            zip
            unzip
            bash

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps

      - name: Download go toolchain
        shell: msys2 {0}
        run: |
          mkdir -p goenv/gotoolchain
          cd goenv/gotoolchain
          curl -L -O https://go.dev/dl/go1.25.8.windows-${{ matrix.arch }}.zip
          unzip -q go1.25.8.windows-${{ matrix.arch }}.zip
          rm go1.25.8.windows-${{ matrix.arch }}.zip
          cd ../..

      - name: Prepare release spx
        id: prepare_release_spx
        uses: ./.github/actions/prepare-release-spx
        with:
          version: ${{ inputs.version }}

      - name: Prepare release goenv
        uses: ./.github/actions/prepare-release-goenv
        with:
          version: ${{ inputs.version }}
          platform: windows
          package-arch: ${{ matrix.arch_name }}

      - name: Package goenv
        shell: msys2 {0}
        run: |
          # Remove build cache if it exists (users can rebuild locally)
          rm -rf goenv/.cache/build

          # Verify what will be packaged
          echo "[info] Contents to be packaged:"
          du -sh goenv/* goenv/.cache/* 2>/dev/null || true

          # Create zip archive
          cd goenv
          zip -r ../spx-windows-${{ matrix.arch_name }}.zip .
          cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-windows-${{ matrix.arch_name }}
          path: spx-windows-${{ matrix.arch_name }}.zip
          retention-days: 14

      - name: Package standalone spx
        if: ${{ matrix.standalone }}
        uses: ./.github/actions/package-standalone-release
        with:
          package-file: spx-standalone-windows-${{ matrix.arch_name }}.zip
          spx-bin: ${{ steps.prepare_release_spx.outputs.spx-bin }}

      - name: Upload standalone release artifact
        if: ${{ matrix.standalone }}
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-windows-${{ matrix.arch_name }}
          path: spx-standalone-windows-${{ matrix.arch_name }}.zip
          retention-days: 14

      - name: Verify release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-windows-${{ matrix.arch_name }}.zip
          platform: windows
          package-arch: ${{ matrix.arch_name }}

      - name: Verify standalone release package
        if: ${{ matrix.standalone }}
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-standalone-windows-${{ matrix.arch_name }}.zip
          layout: standalone
          platform: windows
          package-arch: ${{ matrix.arch_name }}

      - name: Publish goenv release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: spx-windows-${{ matrix.arch_name }}.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish standalone release asset
        if: github.event_name == 'release' && matrix.standalone
        uses: softprops/action-gh-release@v3
        with:
          files: spx-standalone-windows-${{ matrix.arch_name }}.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
