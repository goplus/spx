name: Release Windows Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-windows
  cancel-in-progress: true

jobs:
  windows-standalone:
    name: Package Windows standalone
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            zip
            unzip
            bash

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/prepare-standalone-release
        with:
          version: ${{ inputs.version }}

      - name: Package standalone release
        uses: ./.github/actions/package-standalone-release
        with:
          package-file: spx-standalone-windows-x64.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-windows-x64
          path: spx-standalone-windows-x64.zip
          retention-days: 14

      - name: Verify standalone release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-standalone-windows-x64.zip
          platform: windows
          package-arch: x64

      - name: Publish standalone release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: spx-standalone-windows-x64.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
