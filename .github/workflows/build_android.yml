name: Build Android APK

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-android
  cancel-in-progress: true

jobs:

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Linux dependencies
      run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev
      if: ${{ runner.os == 'Linux' }}

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r23c
        add-to-path: true
        local-cache: true

    - name: Set up toolchain and engine assets
      uses: ./.github/actions/deps

    - name: Export ANDROID_NDK_ROOT
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Verify and fix Android NDK installation
      run: |
        echo "[info] Android NDK root: $ANDROID_NDK_ROOT"
        echo "[info] Checking for clang binary"
        CLANG_PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        
        if [ ! -f "$CLANG_PATH" ]; then
          echo "[warn] Clang binary not found; installing NDK r23c manually"
          
          # Create temporary directory
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          
          # Download NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          
          # Extract to a temp location
          unzip -q android-ndk-r23c-linux.zip
          
          # Move to the expected location
          rm -rf "$ANDROID_NDK_ROOT"
          mv android-ndk-r23c "$ANDROID_NDK_ROOT"
          
          # Cleanup
          cd -
          rm -rf "$TMP_DIR"
          
          echo "[ok] NDK r23c installed"
        else
          echo "[ok] Clang binary found: $CLANG_PATH"
        fi
        
        # Verify installation
        echo "[info] Verifying NDK installation"
        ls -la "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || echo "[error] Clang still not found" >&2
        ls -la "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" || echo "[error] Android clang wrapper not found" >&2

    - name: Download Android export templates
      run: |
        echo "[info] Downloading Android engine templates"
        "$BUILDCTL" engine download --platform android
        echo "[info] Downloaded template directory:"
        ls -la ~/.local/share/godot/export_templates/

    - name: Build sample APK
      shell: bash
      run: cd tutorial/00-Hello && spx exportapk 2>&1 | tee build_apk.txt || true

    - name: Verify APK output
      shell: bash
      run: |
        echo "[info] Checking APK output"
        APK_DIR="tutorial/00-Hello/project/.builds/android"

        if [ ! -d "$APK_DIR" ]; then
          echo "[error] Build directory not found: $APK_DIR" >&2
          exit 1
        fi

        echo "[info] Build directory contents:"
        ls -la "$APK_DIR"

        APK_COUNT=$(find "$APK_DIR" -name "*.apk" -type f | wc -l)

        if [ "$APK_COUNT" -eq 0 ]; then
          echo "[error] No APK file found in $APK_DIR" >&2
          echo "[error] Build failed; no APK was generated" >&2
          exit 1
        fi

        echo "[ok] Found $APK_COUNT APK file(s)"
        find "$APK_DIR" -name "*.apk" -type f -exec ls -lh {} \;

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: android-apk
        path: tutorial/00-Hello/project/.builds/android/*.apk
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: android-build-log
        path: tutorial/00-Hello/build_apk.txt
        if-no-files-found: warn
