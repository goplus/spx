name: Build Android APK

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-android
  cancel-in-progress: true

jobs:

  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Linux dependencies
      run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev
      if: ${{ runner.os == 'Linux' }}

    - name: Set up toolchain and engine assets
      id: deps
      uses: ./.github/actions/deps
      with:
        require-android-ndk-alias: 'true'

    - name: Set up locked Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ steps.deps.outputs.jdk-version }}

    - name: Set up locked Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: ${{ steps.deps.outputs.android-ndk-installer-alias }}
        add-to-path: true
        local-cache: true

    - name: Export ANDROID_NDK_ROOT
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Verify locked Android NDK installation
      shell: bash
      env:
        LOCKED_ANDROID_NDK_VERSION: ${{ steps.deps.outputs.android-ndk-version }}
      run: |
        set -euo pipefail

        echo "[info] Android NDK root: $ANDROID_NDK_ROOT"
        if [ -z "${ANDROID_NDK_ROOT:-}" ] || [ ! -d "$ANDROID_NDK_ROOT" ]; then
          echo "[error] Android NDK root is missing: ${ANDROID_NDK_ROOT:-<unset>}" >&2
          exit 1
        fi

        SOURCE_PROPERTIES="$ANDROID_NDK_ROOT/source.properties"
        if [ ! -f "$SOURCE_PROPERTIES" ]; then
          echo "[error] Android NDK source.properties not found: $SOURCE_PROPERTIES" >&2
          exit 1
        fi
        INSTALLED_ANDROID_NDK_VERSION="$(sed -nE 's/^[[:space:]]*Pkg\.Revision[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "$SOURCE_PROPERTIES")"
        if [ "$INSTALLED_ANDROID_NDK_VERSION" != "$LOCKED_ANDROID_NDK_VERSION" ]; then
          echo "[error] Android NDK revision is $INSTALLED_ANDROID_NDK_VERSION, lock requires $LOCKED_ANDROID_NDK_VERSION" >&2
          exit 1
        fi

        CLANG_PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        ANDROID_CLANG_PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
        for tool in "$CLANG_PATH" "$ANDROID_CLANG_PATH"; do
          if [ ! -x "$tool" ]; then
            echo "[error] Required Android NDK compiler is missing or not executable: $tool" >&2
            exit 1
          fi
          "$tool" --version
        done

        if ! "$CLANG_PATH" --version | grep -F "Android" >/dev/null; then
          echo "[error] NDK clang does not identify itself as an Android toolchain: $CLANG_PATH" >&2
          exit 1
        fi
        echo "[ok] Android NDK $INSTALLED_ANDROID_NDK_VERSION matches runtime.lock.json"

    - name: Download Android export templates
      run: |
        echo "[info] Downloading Android engine templates"
        "$BUILDCTL" engine download --platform android
        echo "[info] Downloaded template directory:"
        ls -la ~/.local/share/godot/export_templates/

    - name: Build sample APK
      shell: bash
      run: cd tutorial/00-Hello && spx exportapk 2>&1 | tee build_apk.txt || true

    - name: Verify APK output
      shell: bash
      run: |
        echo "[info] Checking APK output"
        APK_DIR="tutorial/00-Hello/project/.builds/android"

        if [ ! -d "$APK_DIR" ]; then
          echo "[error] Build directory not found: $APK_DIR" >&2
          exit 1
        fi

        echo "[info] Build directory contents:"
        ls -la "$APK_DIR"

        APK_COUNT=$(find "$APK_DIR" -name "*.apk" -type f | wc -l)

        if [ "$APK_COUNT" -eq 0 ]; then
          echo "[error] No APK file found in $APK_DIR" >&2
          echo "[error] Build failed; no APK was generated" >&2
          exit 1
        fi

        echo "[ok] Found $APK_COUNT APK file(s)"
        find "$APK_DIR" -name "*.apk" -type f -exec ls -lh {} \;

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: android-apk
        path: tutorial/00-Hello/project/.builds/android/*.apk
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: android-build-log
        path: tutorial/00-Hello/build_apk.txt
        if-no-files-found: warn
