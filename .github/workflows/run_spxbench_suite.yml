name: Run spxbench regression suite

on:
  workflow_call:
    inputs:
      version:
        description: SPX package version without the leading v
        required: true
        type: string
      artifact_id:
        description: Validated PR artifact ID; empty selects the release Web artifact
        type: string
        default: ''
      artifact_run_id:
        description: CI run that produced the PR artifact
        type: number
        default: 0
      target_sha:
        description: Tested PR merge commit; empty selects the release commit
        type: string
        default: ''
    secrets:
      SPXBENCH_API_TOKEN:
        description: Token used to install the candidate and run the spxbench suite
        required: true

jobs:
  run-spxbench-suite:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}-rc.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out spxbench scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release Web artifact
        id: release
        shell: bash
        if: inputs.artifact_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=web-release" |
            jq -er '.artifacts | map(select(.name == "web-release" and (.expired == false))) |
              if length == 1 then "id=\(.[0].id)" else error("Expected one unexpired web-release artifact") end' >> "$GITHUB_OUTPUT"

      - name: Download the candidate Web bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id || steps.release.outputs.id }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/spxbench-candidate
          merge-multiple: true

      - name: Run spxbench regression suite
        env:
          SPXBENCH_API_TOKEN: ${{ secrets.SPXBENCH_API_TOKEN }}
          SPXBENCH_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
          SPXBENCH_ARTIFACT_ID: ${{ inputs.artifact_id || steps.release.outputs.id }}
          CANDIDATE_SHA: ${{ inputs.target_sha || github.sha }}
          WEB_ARCHIVE_PATH: ${{ runner.temp }}/spxbench-candidate/spx_web.zip
        run: python3 .github/scripts/release/run_spxbench_suite.py
