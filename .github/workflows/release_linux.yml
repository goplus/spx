name: Package Linux

on:
  workflow_call:
    inputs:
      engine_artifacts:
        description: 'Use Godot engine artifacts produced by the current workflow run'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-linux
  cancel-in-progress: true

jobs:
  linux-standalone:
    name: Package Linux standalone
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download current-run engine artifacts
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: runtime-*linux-x86_64
          path: runtime-assets
          merge-multiple: true

      - name: Download current-run runtime pack
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v7
        with:
          name: runtime-spx-assets
          path: runtime-assets

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/standalone/prepare
        with:
          engine-asset-dir: ${{ inputs.engine_artifacts && 'runtime-assets' || '' }}

      - name: Package standalone release
        uses: ./.github/actions/standalone/package
        with:
          package-file: spx-standalone-linux-x64.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Verify standalone release package
        uses: ./.github/actions/standalone/verify
        with:
          package-file: spx-standalone-linux-x64.zip
          platform: linux
          package-arch: x64

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-linux-x64
          path: spx-standalone-linux-x64.zip
          retention-days: 14
