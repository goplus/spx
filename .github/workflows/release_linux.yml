name: Release Linux Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-linux
  cancel-in-progress: true

jobs:
  linux-standalone:
    name: Package Linux standalone
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/prepare-standalone-release
        with:
          version: ${{ inputs.version }}

      - name: Package standalone release
        uses: ./.github/actions/package-standalone-release
        with:
          package-file: spx-standalone-linux-x64.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-linux-x64
          path: spx-standalone-linux-x64.zip
          retention-days: 14

      - name: Verify standalone release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-standalone-linux-x64.zip
          platform: linux
          package-arch: x64

      - name: Publish standalone release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: spx-standalone-linux-x64.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
