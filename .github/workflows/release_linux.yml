name: Release Linux Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-linux
  cancel-in-progress: true

jobs:
  linux-goenv:
    name: Package Linux goenv (${{ matrix.arch_name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: 386
            arch_name: x86
          - arch: amd64
            arch_name: x64
          - arch: arm64
            arch_name: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps

      - name: Download Go toolchain
        run: |
          mkdir -p goenv/gotoolchain
          cd goenv/gotoolchain
          curl -L -O https://go.dev/dl/go1.25.8.linux-${{ matrix.arch }}.tar.gz
          tar -xzf go1.25.8.linux-${{ matrix.arch }}.tar.gz
          rm go1.25.8.linux-${{ matrix.arch }}.tar.gz
          cd ../..

      - name: Update template version
        uses: ./.github/actions/replace-version
        with:
          version: ${{ inputs.version }}

      - name: Sync release goenv contents
        uses: ./.github/actions/prepare-release-goenv
        with:
          version: ${{ inputs.version }}

      - name: Package goenv
        run: |
          # Remove build cache if it exists (users can rebuild locally)
          rm -rf goenv/.cache/build

          # Verify what will be packaged
          echo "Contents to be packaged:"
          du -sh goenv/* goenv/.cache/* 2>/dev/null || true

          # Create zip archive
          cd goenv
          zip -r ../spx-linux-${{ matrix.arch_name }}.zip .
          cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-linux-${{ matrix.arch_name }}
          path: spx-linux-${{ matrix.arch_name }}.zip
          retention-days: 14

      - name: Verify release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-linux-${{ matrix.arch_name }}.zip
          platform: linux

      - name: Publish release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: spx-linux-${{ matrix.arch_name }}.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
