name: Package macOS

on:
  workflow_call:
    inputs:
      engine_artifacts:
        description: 'Use Godot engine artifacts produced by the current workflow run'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-macos
  cancel-in-progress: true

jobs:
  macos-standalone:
    name: Package macOS standalone (${{ matrix.arch_name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - arch_name: x64
            runtime_arch: x86_64
            runs_on: macos-15-intel
          - arch_name: arm64
            runtime_arch: arm64
            runs_on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download current-run engine artifacts
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-*macos-${{ matrix.runtime_arch }}
          path: runtime-assets
          merge-multiple: true

      - name: Download current-run universal macOS template
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v8
        with:
          name: runtime-macos-universal
          path: runtime-assets

      - name: Download current-run runtime pack
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v8
        with:
          name: runtime-spx-assets
          path: runtime-assets

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/standalone/prepare
        with:
          engine-asset-dir: ${{ inputs.engine_artifacts && 'runtime-assets' || '' }}

      - name: Package standalone release
        uses: ./.github/actions/standalone/package
        with:
          package-file: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Verify standalone release package
        uses: ./.github/actions/standalone/verify
        with:
          package-file: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          platform: darwin
          package-arch: ${{ matrix.arch_name }}

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-darwin-${{ matrix.arch_name }}
          path: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          retention-days: 14
