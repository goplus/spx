name: Release macOS Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-macos
  cancel-in-progress: true

jobs:
  macos-standalone:
    name: Package macOS standalone (${{ matrix.arch_name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - arch_name: x64
            runs_on: macos-15-intel
          - arch_name: arm64
            runs_on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps

      - name: Prepare standalone release
        id: prepare_standalone_release
        uses: ./.github/actions/prepare-standalone-release
        with:
          version: ${{ inputs.version }}

      - name: Package standalone release
        uses: ./.github/actions/package-standalone-release
        with:
          package-file: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          spx-bin: ${{ steps.prepare_standalone_release.outputs.spx-bin }}

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-standalone-darwin-${{ matrix.arch_name }}
          path: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          retention-days: 14

      - name: Verify standalone release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          platform: darwin
          package-arch: ${{ matrix.arch_name }}

      - name: Publish standalone release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: spx-standalone-darwin-${{ matrix.arch_name }}.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
