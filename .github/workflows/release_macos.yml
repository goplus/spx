name: Release macOS Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (for example, 2.0.1)'
        required: true
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-macos
  cancel-in-progress: true

jobs:
  macos-goenv:
    name: Package macOS goenv (${{ matrix.arch_name }})
    runs-on: macos-latest
    env:
      GOENV_DIR: ../release-goenv
    strategy:
      matrix:
        include:
          - arch: amd64
            arch_name: x64
          - arch: arm64
            arch_name: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps

      - name: Download go toolchain
        run: |
          rm -rf "$GOENV_DIR"
          mkdir -p "$GOENV_DIR/gotoolchain"
          cd "$GOENV_DIR/gotoolchain"
          curl -L -O https://go.dev/dl/go1.25.8.darwin-${{ matrix.arch }}.tar.gz
          tar -xzf go1.25.8.darwin-${{ matrix.arch }}.tar.gz
          rm go1.25.8.darwin-${{ matrix.arch }}.tar.gz
          cd ../..

      - name: Update template version
        uses: ./.github/actions/replace-version
        with:
          version: ${{ inputs.version }}

      - name: Prepare release goenv
        uses: ./.github/actions/prepare-release-goenv
        with:
          version: ${{ inputs.version }}
          platform: darwin
          package-arch: ${{ matrix.arch_name }}
          goenv-dir: ${{ env.GOENV_DIR }}

      - name: Package goenv
        run: |
          WORKSPACE_ROOT="$(pwd)"

          # Remove build cache if it exists (users can rebuild locally)
          rm -rf "$GOENV_DIR/.cache/build"

          # Verify what will be packaged
          echo "Contents to be packaged:"
          du -sh "$GOENV_DIR"/* "$GOENV_DIR"/.cache/* 2>/dev/null || true

          # Create zip archive
          cd "$GOENV_DIR"
          zip -r "$WORKSPACE_ROOT/spx-darwin-${{ matrix.arch_name }}.zip" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-darwin-${{ matrix.arch_name }}
          path: spx-darwin-${{ matrix.arch_name }}.zip
          retention-days: 14

      - name: Verify release package
        uses: ./.github/actions/verify-release
        with:
          package-file: spx-darwin-${{ matrix.arch_name }}.zip
          platform: darwin
          package-arch: ${{ matrix.arch_name }}

      - name: Publish release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: spx-darwin-${{ matrix.arch_name }}.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
