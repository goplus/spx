name: Go Builds

on:
  workflow_call:

jobs:
  go-build:
    name: go-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            coverage-suite: ''
          - os: macos-latest
            coverage-suite: macos
          - os: windows-latest
            coverage-suite: windows
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Build Go packages
        shell: bash
        run: |
          # The native interpreter is built separately as a shared library below.
          packages="$(go list ./... | grep -v '/cmd/ispxnative$')"
          go build -v $packages

      - name: Test native platform behavior
        id: native-tests
        if: matrix.coverage-suite != ''
        shell: bash
        env:
          COVERAGE_SUITE: ${{ matrix.coverage-suite }}
        run: bash .github/scripts/test_go_coverage.sh "$COVERAGE_SUITE"

      - name: Save native coverage for combined upload
        if: matrix.coverage-suite != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.coverage-suite }}
          path: ${{ steps.native-tests.outputs.coverage }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Build cmd/ispx
        if: runner.os == 'Linux'
        working-directory: cmd/ispx
        run: ./build.sh --base

      - name: Build cmd/ispxnative
        shell: bash
        working-directory: cmd/ispxnative
        run: ./build.sh
