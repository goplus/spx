name: Go Builds

on:
  workflow_call:

jobs:
  go-build:
    name: go-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          cd cmd/ispx && go mod download

      - name: Build Go packages
        shell: bash
        run: go build -v $(go list ./... | grep -v /internal/webffi | grep -v /cmd/ispx)

      - name: Test macOS buildctl environment
        id: macos-tests
        if: runner.os == 'macOS'
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh macos

      - name: Upload macOS coverage to Codecov
        if: runner.os == 'macOS'
        uses: codecov/codecov-action@v7
        with:
          slug: goplus/spx
          files: ${{ steps.macos-tests.outputs.coverage }}
          flags: buildctl-macos
          disable_search: true

      - name: Test Windows file replacement and process tracking
        id: windows-tests
        if: runner.os == 'Windows'
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh windows

      - name: Upload Windows coverage to Codecov
        if: runner.os == 'Windows'
        uses: codecov/codecov-action@v7
        with:
          slug: goplus/spx
          files: ${{ steps.windows-tests.outputs.coverage }}
          flags: buildctl-windows
          disable_search: true

      - name: Build cmd/ispx
        if: runner.os == 'Linux'
        working-directory: cmd/ispx
        run: ./build.sh --base

      - name: Build cmd/ispxnative
        shell: bash
        working-directory: cmd/ispxnative
        run: ./build.sh
