name: Go Builds

on:
  workflow_call:

jobs:
  go-build:
    name: go-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          cd cmd/ispx && go mod download

      - name: Build Go packages
        shell: bash
        run: go build -v $(go list ./... | grep -v /internal/webffi | grep -v /cmd/ispx)

      - name: Test Windows file replacement
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v ./internal/cmd/buildctl/shared -run '^(TestReplaceFileWindows|TestWindowsPath|TestFetchURLToFileReplacesExistingDestination)$'

      - name: Build cmd/ispx
        if: runner.os == 'Linux'
        working-directory: cmd/ispx
        run: ./build.sh

      - name: Build cmd/ispxnative
        shell: bash
        working-directory: cmd/ispxnative
        run: ./build.sh
