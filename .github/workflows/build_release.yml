name: Build release artifacts

on:
  workflow_call:
    inputs:
      operation:
        description: 'dry-run, publish-runtime, or publish-release'
        required: true
        type: string
      release_tag:
        description: 'SPX release tag declared by the source commit'
        required: true
        type: string
      reuse_engine_version:
        description: 'Optional published source runtime version for engine reuse'
        required: false
        default: ''
        type: string
      platforms:
        description: 'all or comma-separated web,macos,windows,linux'
        required: true
        type: string
    outputs:
      release_tag:
        description: 'Validated SPX release tag'
        value: ${{ jobs.plan-release.outputs.release_tag }}
      version:
        description: 'SPX package version'
        value: ${{ jobs.plan-release.outputs.version }}
      runtime_version:
        description: 'Runtime artifact version'
        value: ${{ jobs.plan-release.outputs.runtime_version }}
      runtime_tag:
        description: 'Validated runtime release tag'
        value: ${{ jobs.plan-release.outputs.runtime_tag }}
      runtime_manifest:
        description: 'Runtime manifest asset name'
        value: ${{ jobs.plan-release.outputs.runtime_manifest }}
      runtime_state:
        description: 'Verified runtime source: ready or missing'
        value: ${{ jobs.plan-release.outputs.runtime_state }}
      release_repository:
        description: 'Canonical release repository'
        value: ${{ jobs.plan-release.outputs.release_repository }}

permissions:
  contents: read

jobs:
  plan-release:
    name: Validate locked release inputs
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      runtime_version: ${{ steps.release.outputs.runtime_version }}
      runtime_abi: ${{ steps.release.outputs.runtime_abi }}
      runtime_tag: ${{ steps.release.outputs.runtime_tag }}
      runtime_manifest: ${{ steps.release.outputs.runtime_manifest }}
      release_repository: ${{ steps.release.outputs.release_repository }}
      godot_repository: ${{ steps.release.outputs.godot_repository }}
      godot_commit: ${{ steps.release.outputs.godot_commit }}
      runtime_state: ${{ steps.runtime.outputs.runtime_state }}
      engine_state: ${{ steps.runtime.outputs.engine_state }}
      engine_tag: ${{ steps.runtime.outputs.engine_tag }}
      engine_manifest: ${{ steps.runtime.outputs.engine_manifest }}
      package_platforms: ${{ steps.plan.outputs.package_platforms }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate current runtime lock snapshot
        shell: bash
        run: python3 .github/scripts/runtime/lock_snapshot.py check

      - name: Set up locked Go
        uses: ./.github/actions/setup-toolchain

      - name: Describe release and runtime lock
        id: release
        shell: bash
        run: go run ./.github/cmd/runtime-version --github-output "$GITHUB_OUTPUT"

      - name: Validate release inputs
        id: plan
        shell: bash
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          OPERATION_INPUT: ${{ inputs.operation }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_REPOSITORY: ${{ steps.release.outputs.release_repository }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
        run: python3 .github/scripts/release/plan.py inputs
      # Resolution downloads only release metadata and the manifest, then
      # compares its runtime identity with this source. The assemble job
      # downloads and checksum-verifies every published asset before reuse.
      - name: Resolve locked runtime release
        id: runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_ENGINE_VERSION: ${{ inputs.reuse_engine_version }}
        run: go run ./.github/cmd/runtime-resolution --reuse-engine-version "$REUSE_ENGINE_VERSION" --github-output "$GITHUB_OUTPUT"

      - name: Enforce runtime reuse policy
        shell: bash
        env:
          RUNTIME_REASON: ${{ steps.runtime.outputs.runtime_reason }}
          RUNTIME_STATE: ${{ steps.runtime.outputs.runtime_state }}
        run: python3 .github/scripts/release/plan.py runtime-policy

      - name: Verify locked Godot source ancestry
        id: godot-ancestry
        if: steps.runtime.outputs.runtime_state == 'missing'
        shell: bash
        env:
          OPERATION_INPUT: ${{ inputs.operation }}
        run: |
          set -euo pipefail

          ancestry_args=(
            verify-godot
            --lock internal/release/runtime.lock.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$OPERATION_INPUT" = dry-run ]; then
            ancestry_args+=(--allow-premerge-candidate)
          fi
          python3 .github/scripts/runtime/lock_snapshot.py "${ancestry_args[@]}"

      - name: Summarize locked Godot source ancestry
        if: >-
          ${{
            always() &&
            steps.runtime.outcome == 'success' &&
            steps.runtime.outputs.runtime_state != 'incompatible'
          }}
        shell: bash
        env:
          ANCESTRY_STATUS: ${{ steps.godot-ancestry.outputs.godot_ancestry_status }}
          GODOT_COMMIT: ${{ steps.release.outputs.godot_commit }}
          GODOT_REPOSITORY: ${{ steps.release.outputs.godot_repository }}
          GODOT_REF: ${{ steps.godot-ancestry.outputs.godot_ref }}
          GODOT_REF_COMMIT: ${{ steps.godot-ancestry.outputs.godot_ref_commit }}
          OPERATION_INPUT: ${{ inputs.operation }}
          RUNTIME_STATE: ${{ steps.runtime.outputs.runtime_state }}
          RUNTIME_REASON: ${{ steps.runtime.outputs.runtime_reason }}
        run: python3 .github/scripts/release/plan.py ancestry-summary

      - name: Validate immutable publish targets
        if: inputs.operation != 'dry-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RUNTIME_TAG: ${{ steps.release.outputs.runtime_tag }}
          RUNTIME_MANIFEST: ${{ steps.release.outputs.runtime_manifest }}
          REPOSITORY: ${{ steps.release.outputs.release_repository }}
          OPERATION: ${{ inputs.operation }}
        run: python3 .github/scripts/release/publish.py validate-targets

  check-source:
    name: Check source
    needs: plan-release
    uses: ./.github/workflows/check_source.yml
    with:
      check_export_types: true

  build-engine:
    name: Build locked Godot engine
    needs: [plan-release, check-source]
    if: needs.plan-release.outputs.runtime_state == 'missing' && needs.plan-release.outputs.engine_state == 'build'
    # Pin the canonical workflow implementation independently from the Godot
    # source identity supplied by runtime.lock through godot_ref below.
    uses: goplus/godot/.github/workflows/release_builds.yml@28e4566d7dd3f53f942fb55bcba621f3bc25600b
    with:
      runtime_version: ${{ needs.plan-release.outputs.runtime_version }}
      runtime_abi: ${{ needs.plan-release.outputs.runtime_abi }}
      platforms: all
      godot_repository: ${{ needs.plan-release.outputs.godot_repository }}
      godot_ref: ${{ needs.plan-release.outputs.godot_commit }}
      spx_repository: ${{ github.repository }}
      spx_ref: ${{ github.sha }}

  reuse-engine:
    name: Reuse verified Godot engine
    needs: [plan-release, check-source]
    if: needs.plan-release.outputs.runtime_state == 'missing' && needs.plan-release.outputs.engine_state == 'reuse'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go
        uses: ./.github/actions/setup-toolchain

      - name: Download and verify source engine
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.plan-release.outputs.release_repository }}
          ENGINE_TAG: ${{ needs.plan-release.outputs.engine_tag }}
          RUNTIME_MANIFEST: ${{ needs.plan-release.outputs.engine_manifest }}
        run: python3 .github/scripts/release/reuse_engine.py

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: android}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: editor-linux-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: editor-macos-arm64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: editor-macos-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: editor-web}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: editor-windows-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: ios}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: linux-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: macos-arm64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: macos-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: macos-universal, file: macos.zip}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: web-minigame}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: web-miniprogram}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: web-threads}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: web-worker}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: web}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: windows-x86_64}

      - uses: ./.github/actions/upload-reused-engine
        with: {artifact: engine-provenance, file: engine-source-manifest.json}

  build-runtime-pack:
    name: Build runtime pack
    needs: [plan-release, build-engine, reuse-engine]
    if: >-
      ${{
        !cancelled() && needs.plan-release.outputs.runtime_state == 'missing' &&
        (needs.build-engine.result == 'success' || needs.reuse-engine.result == 'success')
      }}
    uses: ./.github/workflows/build_runtime_pack.yml

  runtime-prerequisites:
    name: Verify runtime prerequisites
    needs: [plan-release, check-source, build-engine, reuse-engine, build-runtime-pack]
    if: >-
      ${{
        !cancelled() &&
        needs.plan-release.result == 'success' &&
        needs.check-source.result == 'success' &&
        (
          (needs.plan-release.outputs.runtime_state == 'ready' && needs.build-engine.result == 'skipped' && needs.reuse-engine.result == 'skipped' && needs.build-runtime-pack.result == 'skipped') ||
          (needs.plan-release.outputs.runtime_state == 'missing' && needs.build-runtime-pack.result == 'success' &&
            ((needs.build-engine.result == 'success' && needs.reuse-engine.result == 'skipped') ||
             (needs.build-engine.result == 'skipped' && needs.reuse-engine.result == 'success')))
        )
      }}
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm runtime bundle source
        env:
          RUNTIME_STATE: ${{ needs.plan-release.outputs.runtime_state }}
          RUNTIME_TAG: ${{ needs.plan-release.outputs.runtime_tag }}
        run: |
          if [ "$RUNTIME_STATE" = ready ]; then
            echo "[info] Products will consume published $RUNTIME_TAG"
          else
            echo "[info] Products will consume current-run runtime artifacts"
          fi

  package-web:
    name: Package Web
    needs: [plan-release, runtime-prerequisites]
    if: ${{ !cancelled() && needs.runtime-prerequisites.result == 'success' && contains(fromJSON(needs.plan-release.outputs.package_platforms), 'web') }}
    uses: ./.github/workflows/package_web.yml
    with:
      engine_artifacts: ${{ needs.plan-release.outputs.runtime_state == 'missing' }}

  package-macos:
    name: Package macOS
    needs: [plan-release, runtime-prerequisites]
    if: ${{ !cancelled() && needs.runtime-prerequisites.result == 'success' && contains(fromJSON(needs.plan-release.outputs.package_platforms), 'macos') }}
    uses: ./.github/workflows/package_macos.yml
    with:
      engine_artifacts: ${{ needs.plan-release.outputs.runtime_state == 'missing' }}

  package-windows:
    name: Package Windows
    needs: [plan-release, runtime-prerequisites]
    if: ${{ !cancelled() && needs.runtime-prerequisites.result == 'success' && contains(fromJSON(needs.plan-release.outputs.package_platforms), 'windows') }}
    uses: ./.github/workflows/package_windows.yml
    with:
      engine_artifacts: ${{ needs.plan-release.outputs.runtime_state == 'missing' }}

  package-linux:
    name: Package Linux
    needs: [plan-release, runtime-prerequisites]
    if: ${{ !cancelled() && needs.runtime-prerequisites.result == 'success' && contains(fromJSON(needs.plan-release.outputs.package_platforms), 'linux') }}
    uses: ./.github/workflows/package_linux.yml
    with:
      engine_artifacts: ${{ needs.plan-release.outputs.runtime_state == 'missing' }}

  assemble-release:
    name: Assemble and verify releases
    needs:
      - plan-release
      - runtime-prerequisites
      - package-web
      - package-macos
      - package-windows
      - package-linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      PACKAGE_PLATFORMS: ${{ needs.plan-release.outputs.package_platforms }}
    steps:
      - name: Require completed release inputs
        shell: python
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])

          def require_success(job):
              result = needs.get(job, {}).get("result", "missing")
              if result != "success":
                  raise SystemExit(f"{job}: expected success, got {result}")

          require_success("plan-release")
          require_success("runtime-prerequisites")
          platforms = json.loads(os.environ["PACKAGE_PLATFORMS"])
          if not isinstance(platforms, list):
              raise SystemExit("Expected a list of package platforms")
          for platform in platforms:
              require_success(f"package-{platform}")

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go
        uses: ./.github/actions/setup-toolchain

      - name: Download release build artifacts
        if: needs.plan-release.outputs.runtime_state == 'missing' || inputs.operation != 'publish-runtime'
        uses: actions/download-artifact@v8
        with:
          pattern: '{runtime-*,web-release,web-worker-release,web-minigame-release,web-miniprogram-release,spx-standalone-*}'
          path: artifacts

      - name: Assemble immutable asset sets
        id: assemble
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.plan-release.outputs.release_repository }}
          RUNTIME_STATE: ${{ needs.plan-release.outputs.runtime_state }}
          ENGINE_STATE: ${{ needs.plan-release.outputs.engine_state }}
          RUNTIME_TAG: ${{ needs.plan-release.outputs.runtime_tag }}
          RUNTIME_MANIFEST: ${{ needs.plan-release.outputs.runtime_manifest }}
        run: python3 .github/scripts/release/assemble.py

      - name: Upload assembled runtime release
        if: needs.plan-release.outputs.runtime_state == 'missing' || inputs.operation == 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: spx-runtime-release-${{ needs.plan-release.outputs.runtime_version }}
          path: dist/runtime
          if-no-files-found: error
          retention-days: 14

      - name: Upload assembled SPX release
        if: steps.assemble.outputs.product_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: spx-product-release-${{ needs.plan-release.outputs.version }}
          path: dist/product
          if-no-files-found: error
          retention-days: 14
