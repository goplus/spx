name: Package Windows

on:
  workflow_call:
    inputs:
      engine_artifacts:
        description: 'Use Godot engine artifacts produced by the current workflow run'
        required: false
        default: false
        type: boolean

jobs:
  package-windows:
    name: Package Windows standalone
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download current-run engine artifacts
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-*windows-x86_64
          path: runtime-assets
          merge-multiple: true

      - name: Download current-run runtime pack
        if: inputs.engine_artifacts
        uses: actions/download-artifact@v8
        with:
          name: runtime-spx-assets
          path: runtime-assets

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            unzip
            bash

      - name: Package and upload standalone artifact
        uses: ./.github/actions/package-standalone
        with:
          engine-asset-dir: ${{ inputs.engine_artifacts && 'runtime-assets' || '' }}
          platform: windows
          package-arch: x64
          artifact-name: spx-standalone-windows-x64
