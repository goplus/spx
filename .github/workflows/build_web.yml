name: Build Web Bundle

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build web bundle (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            zip_file: spx_web.zip
          - mode: worker
            zip_file: spx_web_worker.zip
          - mode: minigame
            zip_file: spx_web_minigame.zip
          - mode: miniprogram
            zip_file: spx_web_miniprogram.zip
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install \
            gcc \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            xorg-dev \
            libasound2-dev \
            libopenal-dev \
            binaryen \
            brotli

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: web
          web-mode: ${{ matrix.mode }}

      - name: Export web bundle
        env:
          MATRIX_MODE: ${{ matrix.mode }}
        run: |
          "$BUILDCTL" runtime export-web --mode "$MATRIX_MODE"

      - name: Verify bundle artifact
        run: |
          if [ ! -f "${{ matrix.zip_file }}" ]; then
            echo "${{ matrix.zip_file }} not found"
            exit 1
          fi

          ls -lh "${{ matrix.zip_file }}"
