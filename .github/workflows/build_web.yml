name: Build Web Bundle

on:
  workflow_call:

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build Web bundle (normal)
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-dependencies
        timeout-minutes: 20
        with:
          profile: web

      - name: Build Web bundle
        uses: ./.github/actions/build-web-bundle
