name: Build Web Bundle

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build web bundle (normal)
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-dependencies
        timeout-minutes: 20
        with:
          packages: |
            gcc
            libgl1-mesa-dev
            libegl1-mesa-dev
            libgles2-mesa-dev
            libx11-dev
            xorg-dev
            libasound2-dev
            libopenal-dev
            binaryen
            brotli

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: web
          web-mode: normal

      - name: Export web bundle
        run: |
          "$BUILDCTL" runtime export-web --mode normal

      - name: Verify bundle artifact
        run: |
          if [ ! -f spx_web.zip ]; then
            echo "[error] Bundle artifact not found: spx_web.zip" >&2
            exit 1
          fi

          echo "[ok] Bundle artifact found: spx_web.zip"
          ls -lh spx_web.zip
