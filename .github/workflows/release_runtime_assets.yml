name: Build Runtime Assets

on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-release-runtime-assets
  cancel-in-progress: true

jobs:
  runtime-assets:
    name: Build runtime assets
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download current-run engine artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-*linux-x86_64
          path: runtime-assets
          merge-multiple: true

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-dependencies
        timeout-minutes: 20
        with:
          packages: |
            gcc
            libgl1-mesa-dev
            libegl1-mesa-dev
            libgles2-mesa-dev
            libx11-dev
            xorg-dev
            libasound2-dev
            libopenal-dev
            zip

      - name: Set up toolchain and engine assets
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Build local buildctl
        uses: ./.github/actions/setup-buildctl

      - name: Build runtime asset bundle
        run: |
          bash .github/scripts/runtime/build_pack.sh \
            runtime-assets \
            dist/spx-runtime-assets.zip

      - name: Upload runtime asset bundle
        uses: actions/upload-artifact@v7
        with:
          name: runtime-spx-assets
          path: dist/spx-runtime-assets.zip
          if-no-files-found: error
          retention-days: 14
