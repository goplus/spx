name: Static Checks

on:
  workflow_call:

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          cd cmd/ispx && go mod download

      - name: Run binding code generation
        run: cd internal/cmd/codegen && SPX_MODULE_SRC="$GITHUB_WORKSPACE/godot_modules/spx" go run .

      - name: Run go generate for runtime packages
        shell: bash
        run: |
          go generate ./cmd/spx/internal/command/...
          go generate ./pkg/ispx/...

      - name: Run go generate for cmd/ispx
        shell: bash
        working-directory: cmd/ispx
        run: go generate ./...

      - name: Ensure working tree is clean
        run: git diff --exit-code

      - name: Test Go code
        shell: bash
        run: |
          go test -v .github/scripts/runtime_asset_manifest.go .github/scripts/runtime_asset_manifest_test.go
          go test -v .github/scripts/runtime_resolution.go .github/scripts/runtime_resolution_test.go
          go test -v .github/scripts/runtime_version.go .github/scripts/runtime_version_test.go
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/runtime_build_contract_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/release_workflow_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/release_bump_test.py
          go run .github/scripts/runtime_pack_source_digest.go HEAD >/dev/null
          go run .github/scripts/runtime_build_recipe_digest.go HEAD >/dev/null
          go test -v $(go list ./... | grep -v /internal/webffi)
          cd cmd/ispx && go test -v ./...
