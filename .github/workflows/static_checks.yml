name: Static Checks

on:
  workflow_call:
    inputs:
      check_export_types:
        description: Require the embedded SPX type snapshot to match generated output byte for byte
        type: boolean
        default: false

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up locked Go and XGo
        uses: ./.github/actions/deps
        with:
          setup-mode: none

      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          cd cmd/ispx && go mod download

      - name: Run binding code generation
        run: cd internal/cmd/codegen && SPX_MODULE_SRC="$GITHUB_WORKSPACE/godot_modules/spx" go run .

      - name: Run go generate for runtime packages
        shell: bash
        run: |
          go generate ./cmd/spx/internal/command/...
          go generate ./pkg/ispx/...

      # Embedded type data also changes for private implementation edits.
      - name: Restore committed SPX type snapshot in regular CI
        if: ${{ !inputs.check_export_types }}
        run: git restore -- pkg/ispx/internal/pkg/github.com/goplus/spx/v4/export.types

      - name: Ensure generated files are up to date
        run: git diff --exit-code

      - name: Check shell scripts
        shell: bash
        run: |
          for script in \
            .github/actions/standalone/lib/platform.sh \
            .github/scripts/runtime/build_pack.sh \
            .github/scripts/npm/prepare_package.sh \
            .github/scripts/release/assemble.sh \
            .github/scripts/test_go.sh \
            .github/scripts/test_go_coverage.sh \
            cmd/ispx/build.sh; do
            bash -n "$script"
          done

      - name: Set up Node.js for Web bridge tests
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test Web bridge
        run: node --test cmd/ispx/tests/*.test.cjs godot_modules/spx/web/tests/*.test.cjs

      - name: Test Go Web packages
        id: web-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh web

      - name: Test Go Web process fallbacks
        id: web-process-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh web-process

      - name: Test Go Web interpreter
        id: web-interpreter-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh web-interpreter

      - name: Test Web ABI memory ownership
        env:
          GDSPX_SANITIZERS: address,undefined
        run: bash godot_modules/spx/web/tests/run_string_abi_test.sh

      - name: Test CI tooling
        id: tool-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh tools

      - name: Test binding generator
        id: codegen-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh codegen

      - name: Test CI contracts
        shell: bash
        run: |
          for script in \
            .github/scripts/runtime_build_contract_test.py \
            .github/scripts/release/workflow_test.py \
            .github/scripts/release_bump_test.py \
            .github/scripts/driverbundle/workflow_test.py \
            cmd/ispx/build_test.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 "$script"
          done

      - name: Check runtime fingerprints
        shell: bash
        run: |
          for digest in pack-source build-recipe; do
            go run .github/scripts/runtime/digest.go "$digest" HEAD >/dev/null
          done

      - name: Test Go modules
        id: go-tests
        shell: bash
        run: bash .github/scripts/test_go_coverage.sh native

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          slug: goplus/spx
          files: ${{ steps.go-tests.outputs.coverage }},${{ steps.web-tests.outputs.coverage }},${{ steps.web-process-tests.outputs.coverage }},${{ steps.web-interpreter-tests.outputs.coverage }},${{ steps.tool-tests.outputs.coverage }},${{ steps.codegen-tests.outputs.coverage }}
          disable_search: true
